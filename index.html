<style>
/* Layout: app shell. Sticky masthead with the year and four tabs over one working column (max 1240px).
   Overview reads summary → detail; the ledger views are full-width tables that scroll sideways inside their own frame. */
:root{
  --bg:#f1f4f2;
  --surface:#fcfdfc;
  --surface-2:#edf1ef;
  --surface-3:#e2e8e5;
  --ink:#13211f;
  --ink-2:#44554f;
  --muted:#6f7e79;
  --line:#d8dfdc;
  --line-2:#bcc8c3;
  --accent:#0d5c63;
  --accent-hover:#0a4a50;
  --accent-ink:#ffffff;
  --accent-soft:#d9ebea;
  --c-income:#1baf7a;
  --c-expenses:#eb6834;
  --c-investments:#2a78d6;
  --good:#0ca30c;
  --good-ink:#006300;
  --good-soft:#e1f2de;
  --bad:#d03b3b;
  --bad-ink:#a82727;
  --bad-soft:#fbe5e3;
  --warn-soft:#fbf0d2;
  --warn-ink:#6e4b00;
  --heat-lo:#ffcccc;
  --heat-mid:#fff2b3;
  --heat-hi:#daf2d0;
  --shadow:0 1px 2px rgba(19,33,31,.06),0 12px 32px rgba(19,33,31,.12);
  --scrim:rgba(19,33,31,.38);
  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c;--surface:#141415;--surface-2:#1b1b1d;--surface-3:#252528;
    --ink:#ececee;--ink-2:#b6b6bb;--muted:#8b8b91;--line:#29292c;--line-2:#3b3b40;
    --accent:#5ebdc3;--accent-hover:#82d1d5;--accent-ink:#06201f;--accent-soft:#1b2829;
    --c-income:#199e70;--c-expenses:#d95926;--c-investments:#3987e5;
    --good:#0ca30c;--good-ink:#52c552;--good-soft:#15301a;
    --bad:#e66767;--bad-ink:#ff928d;--bad-soft:#3a1c1b;--warn-soft:#382d12;--warn-ink:#f0c45c;
    --heat-lo:#5e2b2b;--heat-mid:#54491d;--heat-hi:#21432a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);--scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"],:root[data-ybt-theme="dark"]{
  --bg:#0b0b0c;--surface:#141415;--surface-2:#1b1b1d;--surface-3:#252528;
  --ink:#ececee;--ink-2:#b6b6bb;--muted:#8b8b91;--line:#29292c;--line-2:#3b3b40;
  --accent:#5ebdc3;--accent-hover:#82d1d5;--accent-ink:#06201f;--accent-soft:#1b2829;
  --c-income:#199e70;--c-expenses:#d95926;--c-investments:#3987e5;
  --good:#0ca30c;--good-ink:#52c552;--good-soft:#15301a;
  --bad:#e66767;--bad-ink:#ff928d;--bad-soft:#3a1c1b;--warn-soft:#382d12;--warn-ink:#f0c45c;
  --heat-lo:#5e2b2b;--heat-mid:#54491d;--heat-hi:#21432a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}

/* Appearance setting: Light / Dark chosen in Settings beats the device setting (Automatic removes the attribute) */
:root[data-ybt-theme="light"]{
  --bg:#f1f4f2;--surface:#fcfdfc;--surface-2:#edf1ef;--surface-3:#e2e8e5;
  --ink:#13211f;--ink-2:#44554f;--muted:#6f7e79;--line:#d8dfdc;--line-2:#bcc8c3;
  --accent:#0d5c63;--accent-hover:#0a4a50;--accent-ink:#ffffff;--accent-soft:#d9ebea;
  --c-income:#1baf7a;--c-expenses:#eb6834;--c-investments:#2a78d6;
  --good:#0ca30c;--good-ink:#006300;--good-soft:#e1f2de;
  --bad:#d03b3b;--bad-ink:#a82727;--bad-soft:#fbe5e3;--warn-soft:#fbf0d2;--warn-ink:#6e4b00;
  --heat-lo:#ffcccc;--heat-mid:#fff2b3;--heat-hi:#daf2d0;
  --shadow:0 1px 2px rgba(19,33,31,.06),0 12px 32px rgba(19,33,31,.12);--scrim:rgba(19,33,31,.38);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tab-num{font-variant-numeric:tabular-nums}

html{scrollbar-gutter:stable}
.app{max-width:1600px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:0 64px}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-block:28px 18px}
.kicker{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mast h1{font:800 clamp(24px,3.4vw,32px)/1.05 var(--f-display);letter-spacing:-.01em}
.yearbox{display:flex;align-items:center;gap:4px}
.yearbox select{appearance:none;-webkit-appearance:none;background:transparent;border:0;border-radius:6px;font:800 clamp(30px,4.6vw,44px)/1.15 var(--f-display);letter-spacing:-.02em;height:auto;padding:2px 8px;cursor:pointer;color:var(--ink)}
.yearbox select:hover{background:var(--surface-2)}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;font-size:20px;line-height:1}
.icon-btn:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:default}

.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;padding:12px 12px 13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tab .badge{margin-left:6px}
@media(min-width:861px){.tab .badge[data-t]::after{content:attr(data-t);white-space:nowrap;margin-left:4px}}
.tab .ti{display:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar-end{display:flex;align-items:center;gap:10px;padding-block:6px}
.eye-btn{padding:0;width:32px;justify-content:center}
.guide{border-color:var(--accent)}
.ob-ways{display:grid;gap:10px}
.ob-way{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.ob-way:hover,.ob-way:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.ob-way svg{grid-row:1/span 2;width:20px;height:20px;color:var(--accent)}
.ob-way-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.ob-way-t em{font:600 11px/1 var(--f-body);font-style:normal;padding:3px 7px;border-radius:999px;background:var(--accent);color:var(--surface)}
.ob-way-s{grid-column:2;font-size:13px;color:var(--muted);line-height:1.45}
.ob-month summary{cursor:pointer;font-size:13.5px;font-weight:600}
.ob-month .start-row{margin-top:10px}
.ob-month .help{display:block;margin-top:6px}
.ov-first{display:grid;gap:8px;justify-items:start}
.ov-first h2{margin:0}
.bk-nudge .bk-acts{display:flex;gap:14px;margin-left:auto}
#imp-drop{margin-top:0}
.ai-body{display:grid;gap:14px}
.ai-body .field{margin:0}
.ai-files{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.ai-files li{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:13.5px}
.ai-fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-rules summary{cursor:pointer;font-weight:600;font-size:14px}
.ai-rules .tag{font:600 11px/1 var(--f-body);padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--ink)}
.ai-rules textarea{width:100%;margin-top:8px;font:13px/1.5 var(--f-mono);resize:vertical}
.ai-rules .hint{margin:8px 0 0}
.ai-busy{display:grid;gap:8px;margin:0;font-size:14px}
.ai-errbox{display:grid;gap:8px}
.ai-errbox pre{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font:12px/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}
.ai-errbox summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.ai-busy .loading-bar{width:100%}
.btn [data-action] svg,.btn svg{flex:none}
.ai-review{display:grid;gap:6px;margin-bottom:12px}
.ai-check{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:13.5px;line-height:1.45}
.ai-check svg{width:15px;height:15px;flex:none;margin-top:2px}
.ai-check.ok{color:var(--good-ink)}.ai-check.bad,.ai-check.q{color:var(--warn-ink)}
.ai-out summary{cursor:pointer;font-size:13.5px;font-weight:600}
.ai-out ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;max-height:220px;overflow:auto;font-size:13px}
.ai-out li{display:grid;grid-template-columns:90px minmax(0,1fr) 100px minmax(0,1.2fr);gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.ai-out .num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.ai-ask td{background:var(--warn-soft)}
.note.ai-q{display:block;white-space:normal;color:var(--warn-ink);max-width:280px}
tr.ai-ask td.n{min-width:220px;white-space:normal}
.ob-ai{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px;justify-items:start}
.ob-ai p{margin:0}
@media (max-width:640px){.ai-out li{grid-template-columns:1fr auto}.ai-out li .hint{grid-column:1/-1}}
.guide-wrap{margin-bottom:20px}
.nw-groups-help>div{align-content:start}
.guide-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-4px -6px 0 0}
.guide-steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px 24px;margin:12px 0 18px;padding:0}
.guide-steps li{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.guide-steps small{font-weight:400}
.gs-n{display:inline-grid;place-items:center;width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--line-2);font:600 12px/1 var(--f-body)}
.gs-cur{color:var(--ink)!important}.gs-cur .gs-n{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.gs-done .gs-n{background:var(--good-soft);border-color:transparent;color:var(--good-ink)}
.guide h2{margin:0 0 6px;font-size:19px;line-height:1.3}
.guide p{margin:0;max-width:74ch;line-height:1.55;color:var(--ink-2)}
.guide .guide-groups{margin-top:16px}
.guide-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.guide-skip{margin-left:auto;font-size:13px}
.guide .guide-tour{margin-top:14px;font-size:13px}
.guide-go{animation:guidePulse 2.4s ease-out infinite}
@keyframes guidePulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){.guide-go{animation:none}}
.guide-bar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:11px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent);margin-bottom:18px;font-size:14px}
.acc-start{margin-top:4px;padding:14px 16px;border-radius:8px;background:var(--surface-2)}
.acc-list+.acc-start{margin-top:14px}
.acc-start-q{margin:0 0 12px;font-weight:500;line-height:1.45}
.acc-start-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.acc-start-h{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;margin-bottom:7px}
.acc-start-h .hint{margin:0;font-size:12.5px}
.acc-start-chips{display:flex;flex-wrap:wrap;gap:6px}
.local-top{display:inline-flex;align-items:center;gap:6px}
.local-top svg{flex:none}
@media (max-width:640px){#btn-backup,#btn-export{display:none!important}
  .guide{display:flex;flex-direction:column}.guide .guide-groups{order:6}.guide .guide-acts{order:5}.guide .guide-tour{order:7}
  .bk-nudge .bk-acts{margin-left:0}
  .acc-start-grid{grid-template-columns:1fr}.guide-skip{margin-left:0}.guide-steps{gap:6px 16px}.guide .nw-groups-help{grid-template-columns:1fr 1fr;gap:8px}.guide .nw-groups-help>div{padding:9px 10px}}
@media (max-width:360px){.guide .nw-groups-help{grid-template-columns:1fr}}
.info-btn{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:7px;padding:0;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font:700 11px/1 var(--f-body);font-style:normal;text-transform:none;letter-spacing:0;cursor:help;vertical-align:2px;flex:none}
.info-btn:hover,.info-btn[aria-expanded="true"]{color:var(--ink);border-color:var(--ink-2)}
.info-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar .left .info-btn{margin-left:10px;align-self:center}
#infotip{position:fixed;z-index:70;padding:10px 12px;border-radius:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--shadow);font:400 13px/1.5 var(--f-body);text-transform:none;letter-spacing:0}
.tour-layer{position:fixed;inset:0;z-index:80;background:transparent}
.tour-layer.dim{background:rgba(8,12,11,.55)}
.tour-spot{position:fixed;z-index:81;border-radius:10px;box-shadow:0 0 0 3px var(--accent),0 0 0 9999px rgba(8,12,11,.55);pointer-events:none;transition:top .25s,left .25s,width .25s,height .25s}
.tour-card{position:fixed;z-index:82;width:min(390px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px}
.tour-card.center{left:50%!important;top:50%!important;transform:translate(-50%,-50%)}
.tour-eyebrow{display:flex;justify-content:space-between;gap:8px;font:600 11px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tour-card h3{margin:8px 0 6px;font-size:17px;line-height:1.3}
.tour-card p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.tour-acts{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.tour-nav{display:flex;gap:8px}
@media (max-width:640px){.tour-card{left:12px;right:12px;width:auto}.tour-card.center{left:12px!important;right:12px;transform:translateY(-50%)}}
.eye-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font:500 11.5px/1 var(--f-mono);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--good)}
.sync[data-s="busy"]::before{background:var(--c-investments)}
.sync[data-s="err"]::before{background:var(--bad)}

main{padding-top:24px}

/* controls */
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad-ink);border-color:color-mix(in srgb,var(--bad) 45%,var(--line-2))}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{height:34px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:0 10px;min-width:0}
textarea{height:auto;padding:10px;line-height:1.45;resize:vertical;font:13px/1.45 var(--f-mono)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
select{padding-right:28px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;padding:2px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:5px;padding:5px 11px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg .ct{font:500 11px/1 var(--f-mono);opacity:.75}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
.sw.income{background:var(--c-income)}.sw.expenses{background:var(--c-expenses)}.sw.investments{background:var(--c-investments)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn-soft);color:var(--warn-ink);font:600 11px/1 var(--f-mono)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:14px}
.card h2,.sec-title{font:600 18px/1.25 var(--f-display);letter-spacing:-.005em}
.card .sub,.hint{color:var(--muted);font-size:12.5px;margin-top:3px}
.stack{display:grid;gap:20px}
.notice{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:11px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn-ink);font-weight:500}
.notice .linkish{color:inherit}

/* overview */
.ov-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;align-items:stretch}
.hero{padding:6px 4px 4px 0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero-num{font:700 clamp(36px,5vw,52px)/1.02 var(--f-body);letter-spacing:-.025em}
.hero-sub{color:var(--ink-2)}
.hero-sub b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile+.tile{border-left:1px solid var(--line)}
.tile-label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tile-val{font:650 21px/1.15 var(--f-body);letter-spacing:-.01em;white-space:nowrap}
.tile-sub{font-size:12px;color:var(--muted)}

.inds{display:grid;gap:0}
.ind{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(180px,2.6fr) 96px 132px 128px;grid-template-areas:"l m v t s";align-items:center;gap:8px 20px;padding:12px 0;border-top:1px solid var(--line)}
.ind-label{grid-area:l}.ind-val{grid-area:v}.ind .meter{grid-area:m}.ind-target-wrap{grid-area:t;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.ind .pill{grid-area:s;justify-self:end}
.ind:first-child{border-top:0;padding-top:2px}
.ind-label{font-weight:600}
.ind-label small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--surface-3)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.meter .fill.good{background:color-mix(in srgb,var(--good) 80%,var(--surface))}
.meter .fill.bad{background:color-mix(in srgb,var(--bad) 85%,var(--surface))}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.ind-val{text-align:right;font-weight:650;font-size:16px}
.ind-val small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.ind-target{justify-self:start;border:1px dashed var(--line-2);background:transparent;border-radius:6px;padding:3px 8px;font:500 12.5px/1.3 var(--f-mono);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.ind-target:hover:not(:disabled){border-style:solid;color:var(--ink)}
.ind-target:disabled{cursor:default;border-color:transparent}
.ind input{width:84px;height:28px;font:500 12.5px var(--f-mono)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;justify-self:start}
.pill svg{width:13px;height:13px;flex:none}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}

.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:stretch}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lkey{display:inline-block;width:14px;height:2px;border-radius:1px}
.chart{position:relative;width:100%;min-height:200px}
.chart svg{display:block;max-width:100%;overflow:visible}
#ch-prop{height:330px}
@media (max-width:480px){.tab-long{display:none}}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .ref{stroke:var(--line-2);stroke-width:1}
.chart .tk{fill:var(--muted);font:11px var(--f-body);font-variant-numeric:tabular-nums}
.chart .lbl{fill:var(--ink-2);font:600 11.5px var(--f-body);font-variant-numeric:tabular-nums}
.chart .hl{fill:var(--surface-3);opacity:0;transition:opacity .12s}
.chart .sel{fill:var(--accent-soft)}
.chart path.bar{transition:opacity .1s}
.chart path.bar.dim{opacity:.4}
.chart path.bar.partial{opacity:.5}
.chart .xh{stroke:var(--line-2);stroke-width:1;opacity:0}
.foot-note{margin-top:10px;font-size:12px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}

.hbars{display:grid;gap:3px 40px}
.hbars.cols{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column}
.hb{display:grid;grid-template-columns:minmax(110px,190px) minmax(40px,1fr) 128px;align-items:center;gap:10px;padding:4px 6px;margin:0 -6px;border-radius:5px}
.hb:hover{background:var(--surface-2)}
.hb[data-action]{cursor:pointer}
.hb.on{background:var(--accent-soft)}
.card{scroll-margin-top:64px}
.cat-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 6px 3px 11px;font:600 12.5px var(--f-body);cursor:pointer}
.cat-chip:hover{background:var(--surface-2)}
.cat-chip svg{width:12px;height:12px;display:block}
.hb-label{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{position:relative;height:12px}
.hb-bar{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.hb-val{text-align:right;font-size:13px;font-weight:600;white-space:nowrap}
.hb-val small{font-weight:400;color:var(--muted);margin-left:6px;font-size:11.5px}
.hb-label .rank{display:inline-block;min-width:20px;font:500 11.5px var(--f-mono);color:var(--muted)}
.hb-rest{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.hb-rest b{color:var(--ink);font-variant-numeric:tabular-nums}
.chart .trend{stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5;stroke-linecap:round;opacity:.75}
.lkey.trend{background:none;border-top:2px dashed var(--ink-2);height:0;width:18px}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:8px;padding:9px 11px;font-size:12.5px;min-width:170px;max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s}
#tip.on{opacity:1;transform:none}
#tip .tt{font-weight:700;margin-bottom:5px}
#tip .tr{display:flex;align-items:center;gap:7px;justify-content:space-between}
#tip .tr span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
#tip .tr b{font-variant-numeric:tabular-nums;font-weight:600}
#tip .tsep{border-top:1px solid var(--line);margin:5px 0}

/* yearly grid */
.grid-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:12px}
.heat-legend{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.heat-legend .off{visibility:hidden}
.heat-scale{display:inline-flex;align-items:center;gap:6px}
.heat-scale i{display:inline-block;width:96px;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--heat-lo),var(--heat-mid),var(--heat-hi));border:1px solid var(--line)}
.flag{display:inline-block;width:12px;height:12px;vertical-align:-1px;color:var(--bad);flex:none}
.frame{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.app.wide{max-width:1600px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:12.5px;font-variant-numeric:tabular-nums}
.grid col.c-rh{width:15%}
.grid col.c-tot{width:8%}
.grid th,.grid td{padding:6px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);overflow:hidden}
.grid td{position:relative}
.grid .flagmark{position:absolute;left:4px;top:50%;transform:translateY(-50%);display:flex}
@media (max-width:1399px){table.grid{font-size:12px}}
@media (max-width:1199px){table.grid{font-size:11px}.grid th,.grid td{padding-inline:4px}.grid thead th{font-size:10px;letter-spacing:.03em}}
@media (max-width:1059px){table.grid{font-size:10px}.grid tr.sec th{font-size:13.5px}}
@media (max-width:1023px){table.grid{min-width:960px}}
.grid thead th{position:sticky;top:0;background:var(--surface);font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:10px;z-index:2}
.grid .rh{position:sticky;left:0;z-index:1;text-align:left;background:var(--surface);font-weight:500;padding-left:12px;border-right:1px solid var(--line);white-space:normal;overflow:visible}
.grid thead .rh{z-index:3}
.grid tr.band td,.grid tr.band .rh{background:var(--surface-2)}
.grid td.tot,.grid th.tot{font-weight:650;border-left:1px solid var(--line)}
.grid td{cursor:default}
.grid td.click{cursor:pointer}
.grid td.click:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.grid td.zero{color:var(--muted)}
.grid tr.sec th{position:sticky;left:0;text-align:left;background:var(--surface);font:600 15px/1.3 var(--f-display);padding-top:18px;border-bottom:1px solid var(--line-2)}
.grid tr.sec th .sw{margin-right:8px;vertical-align:1px}
.grid tr.sec td{background:var(--surface);border-bottom:1px solid var(--line-2)}
.grid tr.total td,.grid tr.total .rh{font-weight:700;background:var(--surface-3)}
.grid tr.prop td,.grid tr.prop .rh{color:var(--ink-2);font-style:italic;font-size:12px}
.grid tr.savings td,.grid tr.savings .rh{font-weight:700;background:var(--accent-soft)}
.grid tr.uncat .rh{color:var(--warn-ink);background:var(--warn-soft)}
.rh-in{display:flex;align-items:center;gap:8px;justify-content:space-between}
.switch{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:4px 2px;font-weight:600;font-size:12.5px;color:var(--ink);cursor:pointer}
.switch .knob{position:relative;width:30px;height:18px;border-radius:9px;background:var(--line-2);transition:background .15s;flex:none}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"] .knob{background:var(--accent)}
.switch[aria-checked="true"] .knob::after{transform:translateX(12px)}
.nw{display:inline-flex;align-items:center;justify-content:center;font:500 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:4px;color:var(--ink-2);border:1px solid var(--line-2);flex:none}
.nw.need{background:var(--surface-3);border-color:var(--surface-3)}
.cell-flag{display:inline-flex;align-items:center;gap:5px}

/* transactions */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar .left,.toolbar .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input[type=search]{width:min(320px,100%)}
.tx-sum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.tx-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
table.tx{width:100%;border-collapse:collapse;font-size:13.5px}
.tx th{text-align:left;font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tx th.r,.tx td.r{text-align:right}
.tx th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
.tx th button:hover{color:var(--ink)}
.tx td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tx tbody tr{cursor:pointer}
.tx tbody tr:hover td{background:var(--surface-2)}
.tx .d{font:13px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.tx .c{word-break:break-word;min-width:160px}
.tx .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.tx select{height:30px;font-size:13px;max-width:230px;width:100%}
.tx select.missing{border-color:color-mix(in srgb,var(--warn-ink) 55%,var(--line-2));background:var(--warn-soft);color:var(--warn-ink)}
.cat-text.missing{color:var(--warn-ink);font-weight:600}
.more{display:flex;justify-content:center;padding:14px}
.empty-row td{text-align:center;color:var(--muted);padding:32px 12px;cursor:default}

/* categories */
.cat-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.cat-list{list-style:none;margin:0;padding:0}
.cat-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n a" "u a";align-items:center;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.cat-list li.has-lim{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"n l a" "u l a"}
.cat-list .cat-name{grid-area:n}.cat-list .uses{grid-area:u}.cat-list .lim-btn{grid-area:l}.cat-list .acts{grid-area:a}
.lim-btn{justify-self:end;border:1px dashed var(--line-2);background:transparent;border-radius:6px;padding:3px 8px;font:500 12px/1.3 var(--f-mono);color:var(--muted);cursor:pointer;white-space:nowrap}
.lim-btn.on{border-style:solid;color:var(--ink);background:var(--surface-2)}
button.lim-btn:hover{border-style:solid;color:var(--ink)}
.lim-tag{display:block;font:500 10.5px/1.3 var(--f-mono);color:var(--muted);font-style:normal}
.grid td.under{box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--good) 60%,transparent)}
.grid td.over{box-shadow:inset 0 -3px 0 var(--bad)}
.grid td.click.over:hover,.grid td.click.under:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.lim-legend{display:inline-flex;align-items:center;gap:6px}
.lim-legend i{display:inline-block;width:16px;height:3px;border-radius:2px}
.lim-legend i.u{background:color-mix(in srgb,var(--good) 60%,transparent)}
.lim-legend i.o{background:var(--bad);margin-left:8px}
.tm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px}
.tm-stats>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.tm-num{font:650 20px/1.15 var(--f-body);letter-spacing:-.01em;white-space:nowrap}
.tm-h{font:600 13px/1.3 var(--f-body);color:var(--ink-2);margin:18px 0 6px}
.lims{display:grid}
.lim-row{display:grid;grid-template-columns:minmax(110px,190px) minmax(60px,1fr) 150px 120px;gap:14px;align-items:center;padding:6px;margin:0 -6px;border-radius:5px;cursor:pointer}
.lim-row:hover{background:var(--surface-2)}
.lim-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lim-track{position:relative;height:10px;border-radius:5px;background:var(--surface-3)}
.lim-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.lim-fill.good{background:color-mix(in srgb,var(--good) 80%,var(--surface))}
.lim-fill.warn{background:#d9a21b}
.lim-fill.bad{background:color-mix(in srgb,var(--bad) 85%,var(--surface))}
.lim-pace{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink-2);border-radius:1px}
.lim-val{font-size:13px;font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lim-val small{font-weight:400;color:var(--muted);font-size:12px}
.lim-left{font-size:12.5px;color:var(--good-ink);font-weight:600;text-align:right;white-space:nowrap}
.lim-left.over{color:var(--bad-ink)}
.tm-top{display:flex;flex-wrap:wrap;gap:6px}
.tm-chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.tm-chip:hover{background:var(--surface-2)}
.tm-chip b{font-variant-numeric:tabular-nums;font-weight:600}
.tm-hint{margin-top:14px}
.cat-list li:first-child{border-top:0}
.cat-name{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.cat-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uses{font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.acts{display:flex;gap:2px}
button.nw{cursor:pointer}
button.nw:hover{border-color:var(--ink-2);color:var(--ink)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.inline-form input[type=text]{flex:1 1 160px}
.kw-test{background:var(--surface-2);border-radius:8px;padding:12px;margin-bottom:14px;display:grid;gap:8px}
.kw-test label{font-weight:600;font-size:13px}
.kw-test input{width:100%}
.kw-out{font-size:13px;color:var(--ink-2);min-height:20px}
.kw-out b{color:var(--ink)}
code,.kw{font:12.5px var(--f-mono);background:var(--surface-2);border-radius:4px;padding:1px 5px}
.kw-list{display:grid;margin-top:10px}
.kw-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,190px) 30px;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.kw-row:first-child{border-top:0}
.kw-row .kw{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kw-row select{height:30px;font-size:12.5px}
.warn-text{color:var(--warn-ink);font-size:12px}
.skip-list{list-style:none;margin:0;padding:0}
.skip-list li{display:grid;grid-template-columns:auto minmax(0,1fr) 30px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.skip-list li:first-child{border-top:0}
.skip-list .uses{white-space:normal}
#add-skip-form .warn-text{flex-basis:100%}
.howto{margin-top:20px}
.howto summary{cursor:pointer;font-weight:600}
.howto ol,.howto ul{margin:10px 0 0;padding-left:20px;color:var(--ink-2);display:grid;gap:6px;max-width:72ch}

/* modal */
#overlay{position:fixed;inset:0;z-index:50;display:none}
#overlay.on{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.modal{position:absolute;left:50%;top:max(24px,6vh);transform:translateX(-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - max(48px,12vh));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal.wide{width:min(1000px,calc(100% - 24px))}
.modal.mid{width:min(720px,calc(100% - 24px))}
.tab.due .tl::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn-ink);margin-left:5px;vertical-align:2px}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.m-head h3{font:600 18px/1.25 var(--f-display)}
.m-head p{color:var(--muted);font-size:12.5px;margin-top:2px}
.m-body{padding:16px 20px;display:grid;gap:14px}
.m-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 20px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.m-foot .r{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.field{display:grid;gap:5px}
.field label,.field .lab{font-weight:600;font-size:12.5px;color:var(--ink-2)}
.field input,.field select{width:100%}
.field .help{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--bad-ink);font-weight:600}
.f-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.suggest{font-size:12.5px;color:var(--ink-2)}
.seg.dir{display:flex;width:100%;height:34px;align-self:start}
.seg.dir label{flex:1 1 0;position:relative;display:flex;min-width:0}
.seg.dir input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.seg.dir span{flex:1;display:flex;align-items:center;justify-content:center;border-radius:5px;padding:0 10px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.dir label:hover span{background:var(--surface-2);color:var(--ink)}

.nw-faded{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px}
.nw-faded p{margin:0 0 6px;font-weight:600}
.nw-faded ul{margin:0 0 8px;padding-left:18px;display:grid;gap:3px}
.nw-faded .linkish{font-size:12.5px;margin-left:4px}
#tip .tr.warn span{color:var(--warn-ink);font-weight:600;white-space:normal;max-width:260px}
.nw-legend{margin:-4px 0 6px}
.chart .tk.nw-yr{font-weight:700;fill:var(--ink-2)}
.nwimp-steps{list-style:none;padding:0;margin:0;display:grid;gap:18px;counter-reset:st}
.nwimp-steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;counter-increment:st}
.nwimp-steps li::before{content:counter(st);grid-row:1/span 4;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px}
.nwimp-steps li>*{grid-column:2}
.nwimp-steps h4{margin:2px 0 0;font-size:15px}
.nwimp-steps .btn{justify-self:start;margin-top:6px}
.nwimp-steps .drop{margin-top:6px}
.nwimp-new{background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:grid;gap:8px}
.nwimp-new p{margin:0}
.nwimp-nrow{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px;align-items:center}
table.nwimp-t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.nwimp-t th{text-align:left;font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.nwimp-t td{padding:7px 10px;border-bottom:1px solid var(--line)}
.nwimp-t th.r,.nwimp-t td.r{text-align:right;white-space:nowrap}
.nwimp-t td:first-child,.nwimp-t th:first-child{width:34px}
.nwimp-t tr.same td{color:var(--muted)}
.nwimp-st{font-size:12.5px;font-weight:600}
.nwimp-st.new{color:var(--good-ink)}.nwimp-st.upd{color:var(--warn-ink)}.nwimp-st.same{color:var(--muted);font-weight:500}
.nwimp-chg{margin-top:12px}
.nwimp-chg p{margin:0 0 6px}
.nwimp-chg ul{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:13px;max-height:220px;overflow:auto}
.nwimp-chg li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.nwimp-chg .num{white-space:nowrap;font-variant-numeric:tabular-nums}
.ret-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px}
.ret-list .check{align-items:flex-start;line-height:1.35}
.ret-list .check input{margin-top:1px;flex:none;width:15px}
.nw-repay span{flex:1;min-width:0}
.nw-ret-how{margin-top:4px;font-weight:500}
.nw-ret-how .linkish{color:inherit}
.nw-sbar i.fresh{background:var(--g-cash)}
.nw-repay{margin-top:12px;font-weight:500;align-items:flex-start}
.nw-late{flex-wrap:nowrap}
.nw-late>div{flex:1;min-width:0}
.nw-late .bk-acts{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;margin-left:0}
.nw-late .bk-acts .linkish{text-align:left}
.nw-done{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--good-ink);font-weight:600}
.nwimp-nrow label small{display:block;font-weight:500;margin-top:2px}
.drop:focus-within .btn{outline:2px solid var(--accent);outline-offset:2px}
.nwimp-nrow select{min-width:0;width:100%}
.nwimp-t .sh{display:none}
table.nwt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.nwt th{text-align:left;font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.nwt td{padding:8px 12px;border-bottom:1px solid var(--line)}
.nwt th.r,.nwt td.r{text-align:right;white-space:nowrap}
.nwt tr.grp td{background:var(--surface-2);font-weight:650}
.nwt tr.grp .hint{font-weight:400}
.nwt tr.grp .grp-sub::before{content:"· "}
.nwt td.an{padding-left:28px}
.nwt .missing{color:var(--warn-ink);font-size:12.5px}
.chip-risk{display:inline-flex;align-items:center;font:600 10.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--bad-soft);color:var(--bad-ink);vertical-align:1px}
.nw-form{display:grid;gap:8px}
.nw-fgrp{display:flex;align-items:center;gap:8px;font-weight:650;margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.nw-row{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:2px 12px;align-items:center}
.nw-row label{font-size:13.5px}
.nw-row input{text-align:right;font-variant-numeric:tabular-nums}
.nw-row input.carried{color:var(--muted);font-style:italic}
.nw-row .last{grid-column:2;font-size:11.5px;color:var(--muted);text-align:right}
.acc-list{display:grid;gap:8px}
.acc-row{display:grid;grid-template-columns:minmax(0,1fr) 150px auto auto;gap:8px;align-items:center}
.acc-row .acts{display:flex}
.nw-sug{border:1px dashed var(--line-2);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nw-sug:hover{border-style:solid;color:var(--ink)}
@media (max-width:980px){.nw-groups-help{grid-template-columns:1fr 1fr}}
@media (max-width:640px){

  table.nwt thead{display:none}

  .nw-stat{padding:9px 10px}.nw-stat-v{font-size:16px}.nw-stat-l{font-size:11.5px}
  .nwt tfoot td{border-top:0}
  .tiles[style*="--n"]{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nwimp-nrow{grid-template-columns:1fr}
  .nwimp-t th:nth-child(3),.nwimp-t td:nth-child(3){display:none}
  .nwimp-t th{white-space:normal}
  .nwimp-t th,.nwimp-t td{padding:7px 6px}
  .nwimp-t .lg{display:none}.nwimp-t .sh{display:inline;white-space:nowrap}
  .nwimp-chg li{flex-direction:column;gap:2px}
  .nwt tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .nwt td{border:0;padding:0}
  .nwt td.an{padding-left:8px}
  .nwt td:nth-child(3){grid-column:2;grid-row:2;font-size:12px}
  .nwt td:nth-child(3):empty,.nwt td:nth-child(4){display:none}
  .nwt tr.grp{background:var(--surface-2)}
  .nwt tr.grp .hint{display:block;font-size:11.5px;margin-top:1px}
  .nwt tr.grp .grp-sub::before{content:none}
  .nw-groups-help{grid-template-columns:1fr}
  .tab{font-size:9.5px;letter-spacing:-.01em}
}
@media (max-width:370px){.tab{font-size:9px;padding-inline:1px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const kwPack=o=>Object.entries(o).flatMap(([cat,s])=>s.split('|').map(k=>[k,cat]));

/* ───────── helpers ───────── */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
const sum=a=>a.reduce((x,y)=>x+y,0);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* number format: 1.234,56 (default) or 1,234.56, chosen in Settings */
let NF={t:'.',d:','};
const BOOT_NUM=(()=>{ try{ const v=localStorage.getItem('ybt.num'); if(v==='eu'||v==='en') return v; }catch(_){} return 'eu'; })();
function fmtNum(v,dec=2){
  if(!isFinite(v)) return '–';
  const neg=v<0 && Math.abs(v)>=0.5*Math.pow(10,-dec);
  const s=Math.abs(v).toFixed(dec); const [i,f]=s.split('.');
  return (neg?'−':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,NF.t)+(dec?NF.d+f:'');
}
/* "hide amounts": every money figure on screen becomes •••• (signs and percentages stay). Only what's shown changes:
   edit boxes, downloads and exports keep the real numbers. Remembered per browser. */
let HIDE=false; try{ HIDE=localStorage.getItem('ybt.hideAmounts')==='1'; }catch(_){}

function detectDateOrder(rows){
  let day=false, mon=false;
  for(const r of rows) for(const c of r){ if(typeof c!=='string') continue;

function parseDate(v){
  if(v==null||v==='') return null;

    if(v>20000&&v<80000){ const dt=new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000); return isoOf(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate()); }

function parseAmount(v){
  if(typeof v==='number') return isFinite(v)?r2(v):null;
  if(v==null) return null;
  let s=String(v).trim().replace(/US\$/gi,'').replace(/[€$£¥\s ]|EUR|USD|GBP/gi,'').replace(/[−–]/g,'-');
  let neg=false;
  const p=s.match(/^\((.*)\)$/); if(p){ s=p[1]; neg=true; }
  if(/-$/.test(s)){ s=s.slice(0,-1); neg=!neg; }
  if(!/^[+-]?[\d.,]*\d[\d.,]*$/.test(s)) return null;
  const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.'), cnt=ch=>(s.split(ch).length-1);
  if(lc>-1&&ld>-1){ const dec=lc>ld?',':'.'; if(cnt(dec)!==1) return null; s = dec===',' ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(lc>-1){ const many=cnt(',')>1, dec=s.length-lc-1, ip=s.slice(0,lc).replace(/^[+-]/,'');
    if(many&&!/^[+-]?\d{1,3}(,\d{3})+$/.test(s)) return null;
    s = (many||(dec===3&&ip!=='0'&&ip!==''))? s.replace(/,/g,'') : s.replace(',','.'); }
  else if(ld>-1){ const many=cnt('.')>1, dec=s.length-ld-1, ip=s.slice(0,ld).replace(/^[+-]/,'');
    if(many&&!/^[+-]?\d{1,3}(\.\d{3})+$/.test(s)) return null;
    if(many||(dec===3&&ip!=='0'&&ip!=='')) s=s.replace(/\./g,''); }

}

  aiTooManyImages:[n=>`Too many scanned pages or pictures: Claude can look at ${n} at a time.`,n=>`Demasiadas páginas escaneadas o imágenes: Claude puede ver ${n} a la vez.`],
  aiErr_not_granted:['Claude wasn’t allowed for this page, so nothing was sent. You can allow it from the page’s permissions.','No se ha permitido usar Claude en esta página, así que no se ha enviado nada. Puedes permitirlo en los permisos de la página.'],
  aiErr_rate_limited:['Claude is busy or you’ve reached your usage limit. Try again in a while.','Claude está ocupado o has llegado a tu límite de uso. Inténtalo de nuevo dentro de un rato.'],
  aiErr_prompt_too_large:['That’s more text than Claude can read in one go. Send fewer files at a time, for example one month.','Es más texto del que Claude puede leer de una vez. Envía menos archivos a la vez, por ejemplo un mes.'],
  aiErr_invalid_json:['Claude’s answer came back incomplete. Try again, or with fewer files.','La respuesta de Claude llegó incompleta. Inténtalo de nuevo, o con menos archivos.'],
  aiErr_refused:['Claude declined to read these files. Check they’re statements and try again.','Claude no ha querido leer estos archivos. Comprueba que son extractos e inténtalo de nuevo.'],
  aiErr_other:['Something went wrong talking to Claude. Nothing was changed. Try again.','Algo ha fallado al hablar con Claude. No se ha cambiado nada. Inténtalo de nuevo.'],
  aiErr_bad_key:['Claude didn’t accept your API key, so nothing was sent. Check it in Settings › Reading statements with AI.','Claude no ha aceptado tu clave de API, así que no se ha enviado nada. Revísala en Ajustes › Leer extractos con IA.'],
  aiErr_no_credit:['Your Claude account has no credit left for the API. Add some on its website, then try again.','A tu cuenta de Claude no le queda saldo para la API. Añade saldo en su web y vuelve a intentarlo.'],
  aiErr_network:['Claude couldn’t be reached. Check your connection and try again.','No se ha podido conectar con Claude. Revisa la conexión y vuelve a intentarlo.'],
  aiErr_model:['The model chosen for Claude isn’t available to your key any more. Pick another in Settings › Reading statements with AI.','El modelo elegido para Claude ya no está disponible con tu clave. Elige otro en Ajustes › Leer extractos con IA.'],
  aiErr_empty:['Claude didn’t find any movements in these files.','Claude no ha encontrado movimientos en estos archivos.'],
  aiErr_nobal:['Claude didn’t find any account balances in these files.','Claude no ha encontrado saldos de cuentas en estos archivos.'],
  aiFrom:[n=>`${n} ${n===1?'file':'files'}, read by Claude`,n=>`${n} ${n===1?'archivo':'archivos'}, leídos por Claude`],
  aiAsks:['Claude asks','Claude pregunta'], aiQRows:[n=>`Claude has a question about ${n} ${n===1?'row':'rows'}: they’re marked below.`,n=>`Claude tiene una duda sobre ${n} ${n===1?'fila':'filas'}: están marcadas abajo.`],
  aiCheckOk:[n=>`${n}: the movements add up to the statement’s opening and closing balances.`,n=>`${n}: los movimientos cuadran con el saldo inicial y final del extracto.`],
  aiCheckBad:[(n,a,b)=>`${n}: the statement’s balances move by ${a}, but the movements found add up to ${b}. Something may be missing or counted twice.`,(n,a,b)=>`${n}: los saldos del extracto cambian ${a}, pero los movimientos encontrados suman ${b}. Puede faltar algo o haber algo contado dos veces.`],
  aiLeftOut:[n=>`Left out on purpose (${n})`,n=>`Dejados fuera a propósito (${n})`], aiNotes:['Claude’s notes','Notas de Claude'],
  aiNwFrom:['Balances read by Claude','Saldos leídos por Claude'],
  aiPart:[(i,n)=>`Reading part ${i} of ${n}…`,(i,n)=>`Leyendo la parte ${i} de ${n}…`],
  aiRetry:[(i,n)=>`Busy or no connection. Trying again (${i} of ${n})…`,(i,n)=>`Ocupado o sin conexión. Reintentando (${i} de ${n})…`],
  aiErrWhat:['What went wrong','Qué ha fallado'], aiCopyDetails:['Copy details','Copiar detalles'], aiCopied:['Details copied','Detalles copiados'],
  obAiQ:['Have your bank statements to hand?','¿Tienes a mano tus extractos?'], obAiBtn:['Build it with AI','Crearlo con IA'],
  obAiHelp:['Claude reads them, sorts every movement, finds your accounts’ balances and works out when your tracker starts. You check everything before it’s saved.','Claude los lee, clasifica cada movimiento, encuentra los saldos de tus cuentas y deduce desde cuándo empieza tu control. Lo revisas todo antes de guardarlo.'],

  gEyebrow:[n=>`Set up your tracker · step ${n} of 3`,n=>`Configura tu control · paso ${n} de 3`], gEyebrowDone:['Set up your tracker · done','Configura tu control · listo'],
  gStep_acc:['Your accounts','Tus cuentas'], gStep_val:['What they’re worth','Lo que valen'], gStep_tx:['Your transactions','Tus movimientos'],
  gSkipped:['skipped','saltado'], gDoneSr:['(done)','(hecho)'],
  gTitle_acc:['Start with what you own','Empieza por lo que tienes'],
  gAccText:['Add each place you keep money, only the ones you have: your bank’s current account, a savings account, an investment account, a pension plan… You can name them after your bank and change them later.','Añade cada sitio donde tienes dinero, solo los que tengas: la cuenta corriente de tu banco, una cuenta de ahorro, una cuenta de inversión, un plan de pensiones… Puedes ponerles el nombre de tu banco y cambiarlas más adelante.'],
  gEx_cash:['Current account, savings account','Cuenta corriente, cuenta de ahorro'], gEx_invest:['Investment account, index funds, shares, crypto','Cuenta de inversión, fondos indexados, acciones, cripto'],
  gEx_illiquid:['Crowdlending, property, fixed-term deposits','Crowdlending, inmuebles, depósitos a plazo'], gEx_pension:['Pension plan, company pension','Plan de pensiones, plan de empresa'],
  gTourHint:['Want to see a full example first?','¿Quieres ver antes un ejemplo completo?'],
  gTitle_val:['Enter what they’re worth','Introduce lo que valen'],
  gValText:[m=>`Type what each account was worth at the end of ${m}. Your bank and broker apps show the balance, and a rough figure is fine. This is your starting point: after this you add new figures once a month, and the tracker reminds you.`,m=>`Escribe cuánto valía cada cuenta a final de ${m}. Las apps de tu banco y tu bróker muestran el saldo, y una cifra aproximada vale. Es tu punto de partida: después añades cifras nuevas una vez al mes, y el control te lo recuerda.`],
  gTitle_tx:['Now add your transactions','Ahora añade tus movimientos'],
  gTxText:[m=>`Record the money that came in and went out${m?` since ${m}`:''}: salary, rent, shopping… The quickest way is your bank’s export: download it from your bank’s website or app (.csv or .xlsx) and import it here. Each row is sorted into Income, Expenses or Investments and gets a category from your keywords.`,m=>`Registra el dinero que entró y salió${m?` desde ${m}`:''}: nómina, alquiler, compras… Lo más rápido es el extracto de tu banco: descárgalo desde la web o la app de tu banco (.csv o .xlsx) e impórtalo aquí. Cada fila se clasifica en Ingresos, Gastos o Inversiones y recibe una categoría según tus palabras clave.`],
  gTitle_done:['You’re set up','Ya está todo listo'],
  gDoneText:['From now on: once a month, enter what your accounts are worth (Net worth reminds you when it’s time), and add or import that month’s transactions. Overview shows how the year is going.','A partir de ahora: una vez al mes, introduce lo que valen tus cuentas (Patrimonio te avisa cuando toca) y añade o importa los movimientos de ese mes. El Resumen muestra cómo va el año.'],
  gDoneSkip:['Net worth is there whenever you want it: add your accounts on the Net worth tab.','Patrimonio te espera cuando quieras: añade tus cuentas en la pestaña Patrimonio.'],
  gToOverview:['Go to Overview','Ir al Resumen'], gSkipNw:['Start with my spending instead','Empezar por mis gastos'],
  gHide:['Hide the setup guide','Ocultar la guía'], gHidden:['Setup guide hidden. You can bring it back from Settings.','Guía oculta. Puedes volver a mostrarla desde Ajustes.'],
  gContinue:['Continue','Continuar'], gShow:['Show the setup guide','Mostrar la guía de configuración'],
  nwAccStartQ:['Which of these do you have? Tap to add them, then rename them after your bank or app, for example “BBVA current account”.','¿Cuáles de estas tienes? Púlsalas para añadirlas y luego ponles el nombre de tu banco o app, por ejemplo «Cuenta corriente BBVA».'],
  nwAddOther:['Add another account','Añadir otra cuenta'], nwSugAllAdded:['All added','Todas añadidas'],
  tour_introNew:[['Welcome to your tracker','Before you set it up, here’s a two-minute tour with a made-up example, so you can see every page full of data. Nothing in it is saved. Afterwards a short guide helps you add your accounts, then your transactions.'],['Bienvenido a tu control','Antes de configurarlo, aquí tienes un recorrido de dos minutos con un ejemplo inventado, para que veas cada página llena de datos. Nada de él se guarda. Después, una guía corta te ayuda a añadir tus cuentas y luego tus movimientos.']],
  tourSkipNew:['Skip the tour','Saltar el recorrido'], tourSetup:['Set up my tracker','Configurar mi control'],
  /* info bubbles */
  infoAbout:['What does this mean?','¿Qué significa esto?'],
  info_ovSaved:['Income minus expenses for the months shown. Money you put into investments still counts as saved: it’s still yours, just not in your current account.','Ingresos menos gastos de los meses mostrados. El dinero que pasas a inversiones cuenta como ahorrado: sigue siendo tuyo, solo que no está en tu cuenta corriente.'],
  info_ovLeft:['Income minus expenses minus what you invested: roughly how much more money there is in your everyday accounts than at the start of the year.','Ingresos menos gastos menos lo invertido: más o menos cuánto dinero más hay en tus cuentas del día a día que a principios de año.'],
  info_ovThisMonth:['The month in progress: what you’ve spent so far against a normal month, and against any monthly limits you set in Categories. It fills in as you add transactions.','El mes en curso: lo que llevas gastado frente a un mes normal y frente a los límites mensuales que pongas en Categorías. Se completa según añades movimientos.'],
  info_ovInd:['Each bar is a share of your income for the year, and the tick is its target: green means you’re within it. Need expenses are the essentials (marked Need in Categories), Want expenses the rest. The targets are only suggestions: tap one to change it.','Cada barra es una parte de tus ingresos del año y la marca es su objetivo: en verde, estás dentro. Los gastos necesarios son lo esencial (marcado como Necesario en Categorías) y los caprichos, el resto. Los objetivos son orientativos: toca uno para cambiarlo.'],
  info_ovShare:['For each month, expenses and investments as a percentage of that month’s income. Above the 100% line more went out than came in, so that month drew on savings.','Para cada mes, los gastos y las inversiones como porcentaje de los ingresos de ese mes. Por encima de la línea del 100% salió más de lo que entró, así que ese mes se tiró de ahorros.'],
  info_ovMonthly:['Totals for each month. Pick Income, Expenses or Investments to see one on its own with a dashed trend line: the general direction, without the month-to-month ups and downs. Click a bar to see its transactions.','Totales de cada mes. Elige Ingresos, Gastos o Inversiones para ver solo eso con una línea de tendencia discontinua: la dirección general, sin los altibajos de cada mes. Pulsa una barra para ver sus movimientos.'],
  info_ovCats:['Where the money went in the period you pick, biggest first. Click a category to follow it month by month.','A dónde fue el dinero en el periodo que elijas, de más a menos. Pulsa una categoría para seguirla mes a mes.'],
  info_ovYears:['Each year’s totals side by side, so you can compare whole years.','Los totales de cada año, uno al lado del otro, para comparar años completos.'],
  info_yTable:['Every figure is the total of the transactions behind it: click one to see them. The heat map colours each expense within its month, from least (green) to most (red) spent, leaving rent out so it doesn’t drown the rest. The flag marks the single biggest month and category.','Cada cifra es el total de los movimientos que hay detrás: pulsa una para verlos. El mapa de calor colorea cada gasto dentro de su mes, de menos (verde) a más (rojo), sin el alquiler para que no tape lo demás. La bandera marca el mes y la categoría con más gasto.'],
  info_txKinds:['Income is money coming in. Expenses is money going out; a refund goes here too, as a positive amount. Investments is money moved into funds, shares, a pension or property (negative) or taken back out (positive): it’s still yours, so it doesn’t count as spending.','Ingresos es el dinero que entra. Gastos, el que sale; una devolución también va aquí, en positivo. Inversiones es el dinero que pasas a fondos, acciones, un plan de pensiones o inmuebles (en negativo) o que retiras (en positivo): sigue siendo tuyo, así que no cuenta como gasto.'],
  info_catList:['Categories group your transactions; renaming one moves its transactions and keywords with it. Mark each expense category Need (essentials you’d pay anyway) or Want (nice to have): it feeds the indicators on Overview. A monthly limit shows in This month how much is left.','Las categorías agrupan tus movimientos; al cambiar el nombre de una, sus movimientos y palabras clave pasan con ella. Marca cada categoría de gasto como Necesario (lo esencial, que pagarías igualmente) o Capricho: alimenta los indicadores del Resumen. Un límite mensual muestra en Este mes cuánto queda.'],
  info_catKw:['When a description contains a keyword, the transaction gets that category by itself, on import and when you add a row. If several match, the longest keyword wins; short ones (4 letters or fewer) only match at the start of a word. Type a description in the test box to see which keyword picks it.','Si una descripción contiene una palabra clave, el movimiento recibe esa categoría solo, al importar y al añadirlo. Si coinciden varias, gana la más larga; las cortas (4 letras o menos) solo cuentan al principio de una palabra. Escribe una descripción en la casilla de prueba para ver qué palabra la elige.'],
  info_catSkip:['Rows whose description contains one of these words arrive unticked when you import: for example transfers between your own accounts, which are neither income nor spending.','Las filas cuya descripción contiene una de estas palabras llegan sin marcar al importar: por ejemplo, traspasos entre tus propias cuentas, que no son ni ingresos ni gastos.'],
  info_nwWhat:['Net worth is what everything you own is worth, minus what you owe. Once a month, type what each account is worth at the end of the month, or import several months from Excel, and the tracker shows how it grows and why.','El patrimonio neto es lo que vale todo lo que tienes, menos lo que debes. Una vez al mes, escribe lo que vale cada cuenta a final de mes, o importa varios meses desde Excel, y el control muestra cómo crece y por qué.'],
  info_nwGroups:['Accounts are grouped by how soon you could use the money: Cash now, Investments within days, Illiquid on its own schedule (loans, property), Retirement when you retire. “Without retirement savings” is what you could reach before then.','Las cuentas se agrupan según lo pronto que podrías usar el dinero: Efectivo ya, Inversiones en días, Ilíquido según su propio calendario (préstamos, inmuebles) y Jubilación al jubilarte. «Sin el ahorro para la jubilación» es lo que podrías usar antes.'],
  info_nwChange:['How your net worth moved since the previous month with figures, in two parts. You saved: income minus expenses from your tracker. Markets, interest and gains: everything else, such as price moves, interest and dividends. Moving money between your own accounts changes neither.','Cómo ha cambiado tu patrimonio desde el mes anterior con cifras, en dos partes. Has ahorrado: ingresos menos gastos según tu control. Mercados, intereses y plusvalías: todo lo demás, como cambios de precio, intereses y dividendos. Mover dinero entre tus propias cuentas no cambia ninguna de las dos.'],
  info_nwGoal:['Needed a month is what’s left to the goal divided by the months left. You save a month is your average saving over the last six finished months. From growth is what your investments, illiquid and retirement accounts would have to earn on top of that.','Hace falta al mes es lo que falta para el objetivo dividido entre los meses que quedan. Ahorras al mes es tu ahorro medio de los últimos seis meses completos. Con crecimiento es lo que tendrían que ganar tus inversiones, ilíquido y jubilación además de eso.'],
  info_nwOverTime:['Month-end totals stacked by group. The dashed trend line shows the general direction. A faded month is missing a figure for one of your accounts, so it looks lower than it was.','Totales a fin de mes apilados por grupo. La línea de tendencia discontinua muestra la dirección general. Un mes atenuado no tiene la cifra de alguna cuenta, así que parece más bajo de lo que fue.'],
  info_nwAccounts:['Change is the difference from the previous month with figures; Share is the account’s part of the total. An account you set to 0 is hidden from the next month on, and comes back if you give it a figure.','Cambio es la diferencia con el mes anterior con cifras; Peso es la parte del total que supone la cuenta. Una cuenta que pones a 0 se oculta a partir del mes siguiente y vuelve si le pones una cifra.'],
  info_setStart:['The first month your figures cover. Months before it are greyed out on Yearly tracking and left out of averages: useful if you started tracking mid-year.','El primer mes que cubren tus cifras. Los meses anteriores salen en gris en Seguimiento y no cuentan en las medias: útil si empezaste a registrar a mitad de año.'],
  /* guided tour */
  tourBadge:['Example data · nothing is saved','Datos de ejemplo · no se guarda nada'], tourStep:[(i,n)=>`${i} of ${n}`,(i,n)=>`${i} de ${n}`],
  tourStart:['Start the tour','Empezar el recorrido'], tourSkip:['Skip','Saltar'], tourNext:['Next','Siguiente'], tourBack:['Back','Atrás'], tourEnd:['End tour','Terminar'], tourDone:['Back to my tracker','Volver a mi control'],
  tourWait:['Saving your last change… try again in a moment.','Guardando tu último cambio… inténtalo de nuevo en un momento.'],
  helpTitle:['Help','Ayuda'], helpSub:['A two-minute walk through every page with example data. Your own data isn’t touched.','Un recorrido de dos minutos por todas las páginas con datos de ejemplo. Tus datos no se tocan.'],
  helpInfo:['The i buttons next to titles and figures explain what they mean.','Los botones i junto a títulos y cifras explican qué significan.'],
  tourBtn:['Take the tour','Hacer el recorrido'], emptyTour:['New here? See how it works with example data:','¿Eres nuevo? Mira cómo funciona con datos de ejemplo:'],
  tour_intro:[['Welcome to your tracker','Here’s a two-minute tour with a made-up example, so you can see every page full of data. Nothing in the example is saved, and your own tracker comes back at the end.'],['Bienvenido a tu control','Esto es un recorrido de dos minutos con un ejemplo inventado, para que veas cada página llena de datos. Nada del ejemplo se guarda y tu control vuelve al terminar.']],
  tour_tabs:[['Six pages','Net worth for what you own, Overview for the big picture, Yearly for every figure, Transactions for the rows themselves, Categories for how they’re sorted, and Settings.'],['Seis páginas','Patrimonio para lo que tienes, Resumen para la visión general, Seguimiento para cada cifra, Movimientos para las filas en sí, Categorías para cómo se ordenan, y Ajustes.']],
  tour_ovTop:[['Your year at a glance','How much you kept after expenses this year, and your totals for income, expenses and investments. Any i button explains what a figure means.'],['Tu año de un vistazo','Cuánto has conservado este año tras los gastos y tus totales de ingresos, gastos e inversiones. Cualquier botón i explica qué significa una cifra.']],
  tour_ovMonth:[['This month','How the month in progress is going: what you’ve spent so far against a normal month, and against any monthly limits.'],['Este mes','Cómo va el mes en curso: lo que llevas gastado frente a un mes normal y frente a los límites mensuales.']],
  tour_ovInd:[['Indicators','How your income splits between rent, essentials, wants and investing, against targets you can change.'],['Indicadores','Cómo se reparten tus ingresos entre alquiler, gastos necesarios, caprichos e inversión, frente a objetivos que puedes cambiar.']],
  tour_ovMonthly:[['Month by month','Each month’s income, expenses or investments. Click a bar to see the transactions behind it.'],['Mes a mes','Los ingresos, gastos o inversiones de cada mes. Pulsa una barra para ver los movimientos que hay detrás.']],
  tour_ovCats:[['Where it went','Your categories, biggest first. Click one to follow it month by month.'],['A dónde fue','Tus categorías, de más a menos. Pulsa una para seguirla mes a mes.']],
  tour_yearly:[['Every figure, every month','Laid out like a spreadsheet: categories down the side, months across. Click any figure to see its transactions. The heat map shows where most of the money went each month.'],['Cada cifra, cada mes','Como una hoja de cálculo: categorías a un lado y meses en columnas. Pulsa cualquier cifra para ver sus movimientos. El mapa de calor muestra a dónde fue más dinero cada mes.']],
  tour_txImport:[['Bring in your bank’s export','Paste rows or choose your bank’s file (.csv or .xlsx). Each row is sorted into Income, Expenses or Investments and gets its category from your keywords. Rows already in the tracker are spotted.'],['Trae el extracto de tu banco','Pega filas o elige el archivo de tu banco (.csv o .xlsx). Cada fila va a Ingresos, Gastos o Inversiones y recibe su categoría según tus palabras clave. Las filas que ya están en el control se detectan.']],
  tour_txGuess:[['Categories, guessed','When no keyword matches a row, the tracker suggests a category learned from your past transactions. One click accepts it, and it offers to remember a keyword for next time.'],['Categorías sugeridas','Si ninguna palabra clave coincide, el control sugiere una categoría aprendida de tus movimientos anteriores. Un clic la acepta, y te ofrece guardar una palabra clave para la próxima vez.']],
  tour_catKw:[['Keywords do the sorting','A keyword like “netflix” puts every matching row in its category by itself. Type any description in the test box to see which keyword picks it.'],['Las palabras clave ordenan','Una palabra clave como «netflix» pone sola cada fila que la contenga en su categoría. Escribe cualquier descripción en la casilla de prueba para ver qué palabra la elige.']],
  tour_catList:[['Your categories','Rename, add or remove categories, mark each expense as Need or Want, and set monthly limits.'],['Tus categorías','Cambia el nombre, añade o quita categorías, marca cada gasto como Necesario o Capricho y pon límites mensuales.']],
  tour_nwTop:[['What you own','Once a month, type what each account is worth, or import several months from Excel. Accounts are grouped by how soon you could use the money.'],['Lo que tienes','Una vez al mes, escribe lo que vale cada cuenta o importa varios meses desde Excel. Las cuentas se agrupan según lo pronto que podrías usar el dinero.']],
  tour_nwChart:[['How it grows','Your month-end totals with a trend line. Pick one year or several.'],['Cómo crece','Tus totales a fin de mes con una línea de tendencia. Elige un año o varios.']],
  tour_nwCards:[['Why it changed, and your goal','What changed splits each month into what you saved and what markets added. Goal shows what you need a month and how much would have to come from growth.'],['Por qué cambió y tu objetivo','Qué ha cambiado reparte cada mes entre lo que ahorraste y lo que aportaron los mercados. Objetivo muestra cuánto hace falta al mes y cuánto tendría que venir del crecimiento.']],
  tour_save:[['Saved as you go','Every change is saved straight away. The eye hides all amounts on screen, and Download backup keeps a copy of everything.'],['Se guarda solo','Cada cambio se guarda al momento. El ojo oculta todos los importes de la pantalla y Descargar copia guarda una copia de todo.']],
  tour_end:[['That’s the tour','The button below puts the example away and brings back your own tracker, just as you left it. You can take the tour again from Settings, and the i buttons next to titles explain each figure.'],['Fin del recorrido','El botón de abajo quita el ejemplo y te devuelve tu propio control, tal como lo dejaste. Puedes repetir el recorrido desde Ajustes, y los botones i junto a los títulos explican cada cifra.']],
  tour_endNew:[['That’s the tour','Now it’s your turn. The button below puts the example away and starts the setup guide: first your accounts on Net worth, then your transactions. You can take the tour again from Settings, and the i buttons next to titles explain each figure.'],['Fin del recorrido','Ahora te toca a ti. El botón de abajo quita el ejemplo y empieza la guía de configuración: primero tus cuentas en Patrimonio y luego tus movimientos. Puedes repetir el recorrido desde Ajustes, y los botones i junto a los títulos explican cada cifra.']],
  hideAmounts:['Hide amounts','Ocultar importes'], showAmounts:['Show amounts','Mostrar importes'],
  amountsHidden:['Amounts hidden. Tap the eye to show them again.','Importes ocultos. Pulsa el ojo para volver a verlos.'], amountsShown:['Amounts shown','Importes visibles'], nwTitle:['Net worth','Patrimonio neto'],
  nwSub:['What everything you own is worth at the end of each month. Type the figures in once a month.','Lo que vale todo lo que tienes al final de cada mes. Introduce las cifras una vez al mes.'],
  nwEmptyTitle:['Track what you own, not just what you spend','Controla lo que tienes, no solo lo que gastas'],
  nwEmptyText:['Add the accounts you hold: bank accounts, funds, brokers, crowdlending, pension. Then once a month type in what each one is worth. You’ll see your total, how it’s spread, and how much of each month’s change came from your own saving.','Añade las cuentas que tienes: bancos, fondos, brókers, crowdlending, pensiones. Después, una vez al mes, escribe cuánto vale cada una. Verás el total, cómo se reparte y cuánto de cada cambio mensual viene de tu propio ahorro.'],
  nwAddAccounts:['Add your accounts','Añade tus cuentas'],

function agg(year,fromStart){
  const from=fromStart?ovFirst(year):0;
  return memo('agg'+year+(from?'s'+from:''),()=>{
    const R={};
    for(const t of TKEYS){
      const rows=new Map(), counts=new Map();
      for(const n of catNames(t)){ rows.set(n,new Array(12).fill(0)); counts.set(n,new Array(12).fill(0)); }
      rows.set(UNCAT,new Array(12).fill(0)); counts.set(UNCAT,new Array(12).fill(0));
      R[t]={rows,counts,total:new Array(12).fill(0),uncatCount:0,n:0};
    }
    for(const r of allRows()){
      const y=+r.date.slice(0,4), m=+r.date.slice(5,7)-1;
      if(year!=='all' && y!==year) continue;
      if(m<from) continue;
      const A=R[r.table]; const v=r.table==='investments'?-r.amount:r.amount;
      const key=(r.category && r.category!==UNCAT && A.rows.has(r.category))?r.category:UNCAT;
      if(key===UNCAT) A.uncatCount++;
      A.rows.get(key)[m]+=v; A.counts.get(key)[m]++; A.total[m]+=v; A.n++;
    }
    for(const t of TKEYS){ const A=R[t]; for(const [k,a] of A.rows) A.rows.set(k,a.map(r2)); A.total=A.total.map(r2); }
    const inc=R.income.total, exp=R.expenses.total, inv=R.investments.total;
    R.savings=inc.map((v,i)=>r2(v+exp[i]));
    const Y={inc:r2(sum(inc)),exp:r2(sum(exp)),inv:r2(sum(inv))};
    Y.sav=r2(Y.inc+Y.exp); Y.liquid=r2(Y.inc-Y.inv+Y.exp);
    const div=(a,b)=>b?a/b:0;
    Y.savRate=div(Y.sav,Y.inc); Y.invRate=div(Y.inv,Y.inc); Y.expRate=div(-Y.exp,Y.inc);
    const rowTot=(t,n)=>{ const a=n&&R[t].rows.get(n); return a?sum(a):0; };
    let need=0,want=0; for(const c of cats().expenses){ const v=rowTot('expenses',c.name); if((c.type||'Want')==='Need') need+=v; else want+=v; }
    Y.need=-need; Y.want=-want; Y.rentUtil=-(rowTot('expenses',roleName('expenses','rent'))+rowTot('expenses',roleName('expenses','utilities')));

}

/* Keyword matching. Accents and capitals don't matter (cafetería = CAFETERIA).

const fold=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const SHORT_KW=4;

function kwHealth(t){ return memo('kwh'+t,()=>{

function kwHealthCard(t){

  if(H.overlap.length) body+=sec(L('khOverlapH',H.overlap.length),L('khOverlapHelp'),list('overlap',H.overlap,x=>row(x.i,L('khOverlapRow',K[x.j][0],K[x.j][1]),find(x.i))));
  if(un.length) body+=sec(L('khUnusedH',un.length),L('khUnusedHelp'),(can?`<p style="margin:0 0 6px"><button class="btn sm" type="button" data-action="kh-prune">${esc(L('khPrune',un.length))}</button></p>`:'')+list('unused',un,i=>row(i,'',find(i))));

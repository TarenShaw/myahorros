/* ───────── persistence ───────── */
const dirty=new Set(), busy=new Set(), failed=new Set(); let flushTimer=null, flushing=false, lastErr=null;
function bodyFor(path){
  const [col,id]=path.split('/');
  if(col==='months') return S.months[id]||{income:[],expenses:[],investments:[]};
  if(id==='categories') return cats();
  if(id==='keywords') return kws();
  if(id==='settings') return Object.assign({},S.settings||{},{targets:targets()});
  if(id==='networth') return nw();
  return {};
}
function markDirty(path){
  if(!S.db||!S.canWrite||S.demo) return;
  dirty.add(path); for(const f of failed) dirty.add(f); clearTimeout(flushTimer); flushTimer=setTimeout(flush,250); syncStatus();
}
async function flush(){
  if(flushing||S.demo) return; flushing=true;
  try{
    while(dirty.size){
      const path=dirty.values().next().value; dirty.delete(path); busy.add(path); syncStatus();
      const body=clone(bodyFor(path));
      try{
        try{ await S.db.doc(path).set(body); }
        catch(e){ if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')){ await sleep(500+Math.random()*700); await S.db.doc(path).set(body); } else throw e; }
        failed.delete(path); lastErr=failed.size?lastErr:null;
      }catch(e){
        lastErr=e; const code=e&&e.code;
        if(code==='invalid_argument'||code==='transform_error'){
          if(JSON.stringify(body).length>250*1024){ failed.add(path); toast(L('tooBig')); }
          else { S.canWrite=false; toast(L('readOnly')); render(); }
        }
        else if(code==='quota_exceeded'){ failed.add(path); toast(L('storageFull')); }
        else if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){ S.canWrite=false; render(); }
        else { dirty.add(path); toast(L('saveRetry')); setTimeout(flush,5000); busy.delete(path); break; }
      }finally{ busy.delete(path); }
    }
  }finally{ flushing=false; syncStatus(); }
}
function syncStatus(){
  const el=$('#sync'); if(!el) return;
  let s='idle', k='sync_connecting';
  if(S.mode==='nodb'){ s='idle'; k='sync_nodb'; }
  else if(S.mode==='live'){
    if(dirty.size||busy.size){ s='busy'; k='sync_saving'; }
    else if(failed.size||lastErr){ s='err'; k='sync_err'; }
    else if(!S.canWrite){ s='idle'; k='sync_ro'; }
    else { s='ok'; k='sync_ok'; }
  }
  el.dataset.s=s; el.textContent=L(k);
}
function normRow(r){ return {id:String(r.id||newId()),date:String(r.date||''),amount:Number(r.amount)||0,concept:String(r.concept==null?'':r.concept),category:String(r.category||'')}; }
function normMonth(d){ const o={}; for(const t of TKEYS) o[t]=Array.isArray(d&&d[t])?d[t].filter(r=>r&&r.date).map(normRow):[]; return o; }
function normCats(d){
  const o={};
  for(const t of TKEYS) o[t]=Array.isArray(d&&d[t])&&d[t].length? d[t].map(c=>{
    if(typeof c==='string') return {name:c};
    const x={name:String(c.name)};
    if(t==='expenses') x.type=c.type==='Need'?'Need':'Want';
    if(c.role==='rent'||c.role==='utilities'||c.role==='other') x.role=c.role;
    return x; }) : clone(DEFAULT_CATS[t]);
  return o;
}
function normKw(d){ const o={}; for(const t of TKEYS) o[t]=Array.isArray(d&&d[t])? d[t].filter(p=>Array.isArray(p)&&p[0]).map(p=>[String(p[0]),String(p[1]||'')]) : []; return o; }
function isStockCats(c){ const sig=x=>TKEYS.map(t=>(x[t]||[]).map(c=>c.name).join('|')).join('#'); const s=sig(c); return s===sig(DEFAULT_CATS)||s===sig(DEFAULT_CATS_ES); }

function subscribe(){ subMonths(); subConfig(); }
function subErr(again){ return e=>{ if(e&&e.code==='unavailable'){ setTimeout(again,3000); return; } if(e&&e.code==='revoked'){ S.canWrite=false; syncStatus(); return; } toast(L('lostConn')); }; }
function subMonths(){
  S.db.collection('months').limit(1000).onSnapshot(snap=>{
    const MS=S.demo&&TOUR?TOUR.real.months:S.months;
    for(const d of snap.docs){ const p='months/'+d.id; if(dirty.has(p)||busy.has(p)) continue; MS[d.id]=normMonth(d.data()); }
    S.gotMonths=true; bump(); renderSoon();
  },subErr(subMonths));
}
function subConfig(){
  S.db.collection('config').onSnapshot(snap=>{
    for(const d of snap.docs){ const p='config/'+d.id; if(dirty.has(p)||busy.has(p)) continue;
      const v=clone(d.data()||{});
      const R=S.demo&&TOUR?TOUR.real:null;
      if(R){ if(d.id==='categories') R.cats=normCats(v); else if(d.id==='keywords') R.kw=normKw(v); else if(d.id==='settings') R.settings=v; else if(d.id==='networth') R.nw=normNw(v); continue; }
      if(d.id==='categories') S.cats=normCats(v); else if(d.id==='keywords') S.kw=normKw(v); else if(d.id==='settings') S.settings=v; else if(d.id==='networth') S.nw=normNw(v); }
    S.gotConfig=true; bump(); renderSoon();
  },subErr(subConfig));
}

/* leaving with unsaved changes: save straight away, and on the website ask before closing */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&dirty.size){ clearTimeout(flushTimer); flush(); } });
/* desktop app: the window is closing, so save now and report back whether everything is written */
window.addEventListener('ybt-flush',e=>{
  clearTimeout(flushTimer);
  const report=()=>{ const d=e&&e.detail; if(d&&typeof d.done==='function') d.done(!flushing&&!dirty.size&&!busy.size&&!failed.size); };
  Promise.resolve(dirty.size&&!flushing?flush():null).then(report,report);
});
window.addEventListener('beforeunload',e=>{
  if(window.Neutralino) return;   /* the desktop app waits for its own saves when the window closes */
  if(dirty.size||busy.size||failed.size){ clearTimeout(flushTimer); flush(); e.preventDefault(); e.returnValue=''; }
});

/* ───────── mutations ───────── */
function ensureMonth(mk){ if(!S.months[mk]) S.months[mk]={income:[],expenses:[],investments:[]}; return S.months[mk]; }
function insertSorted(arr,row){ let i=arr.findIndex(r=>r.date<row.date); if(i<0) i=arr.length; arr.splice(i,0,row); }
function findRow(mk,t,id){ const arr=S.months[mk]&&S.months[mk][t]; const i=arr?arr.findIndex(r=>r.id===id):-1; return {arr,i,row:i>-1?arr[i]:null}; }
function upsertTx(old,next){
  if(old){
    const f=findRow(old.mk,old.table,old.id);
    if(f.row && old.mk===next.date.slice(0,7) && old.table===next.table && f.row.date===next.date){
      Object.assign(f.row,{amount:next.amount,concept:next.concept,category:next.category});
      markDirty('months/'+old.mk); bump(); return;
    }
    if(f.i>-1){ f.arr.splice(f.i,1); markDirty('months/'+old.mk); }
  }
  const mk=next.date.slice(0,7); const doc=ensureMonth(mk);
  insertSorted(doc[next.table],{id:(old&&old.id)||newId(),date:next.date,amount:r2(next.amount),concept:next.concept,category:next.category||''});
  markDirty('months/'+mk); bump();
}
function deleteTx(ref){ const f=findRow(ref.mk,ref.table,ref.id); if(f.i<0) return null; const [row]=f.arr.splice(f.i,1); markDirty('months/'+ref.mk); bump(); return {row,index:f.i}; }
function restoreTx(ref,del){ const doc=ensureMonth(ref.mk); doc[ref.table].splice(Math.min(del.index,doc[ref.table].length),0,del.row); markDirty('months/'+ref.mk); bump(); }
function setTxCategory(ref,cat){ const f=findRow(ref.mk,ref.table,ref.id); if(!f.row) return; f.row.category=cat; markDirty('months/'+ref.mk); bump(); }
function forEachRow(t,fn){ for(const mk of Object.keys(S.months)){ let ch=false; for(const r of S.months[mk][t]){ if(fn(r)) ch=true; } if(ch) markDirty('months/'+mk); } bump(); }
function categoriseBlanks(t){
  let filled=0,left=0;
  forEachRow(t,r=>{ if(isKnown(t,r.category)) return false; const m=matchKeyword(t,r.concept); if(m&&isKnown(t,m.cat)){ r.category=m.cat; filled++; return true; } left++; return false; });
  return {filled,left};
}
function ensureCats(){ if(!S.cats) S.cats=clone(DEFAULT_CATS); return S.cats; }
function ensureKw(){ if(!S.kw) S.kw={income:[],expenses:[],investments:[]}; return S.kw; }
function setSettings(patch){ S.settings=Object.assign({},S.settings||{},patch); markDirty('config/settings'); bump(); }

/* renames one category everywhere it's used (the caller saves and redraws) */
function renameCatCore(t,from,nn){
  const roles=Object.keys(ROLE_NAMES).map(r=>[r,roleCat(t,r)]);
  const C=ensureCats(), K=ensureKw(); const c=C[t].find(c=>c.name===from);

  forEachRow(t,r=>{ if(r.category===from){ r.category=nn; return true; } return false; });
  K[t]=K[t].map(p=>p[1]===from?[p[0],nn]:p);
  if(t==='expenses') moveLimit(from,nn);
  moveReturnCat(t,from,nn);
  if(S.ui.tx.cat===from) S.ui.tx.cat=nn;
  if(S.ui.mm.cat===from) S.ui.mm.cat=nn;
}

function catPairs(t){ return memo('catpairs|'+t,()=>{ const out=DEFAULT_CATS[t].map((c,i)=>[c.name,DEFAULT_CATS_ES[t][i]&&DEFAULT_CATS_ES[t][i].name]).filter(p=>p[1]); return out.concat(CAT_EXTRA[t]||[]); }); }
/* renames every category that has a name in the other language; returns [[table,from,to]...] */
function translateCats(to){
  const done=[]; if(!S.cats) return done;
  for(const t of TKEYS){
    const have=()=>new Set(catNames(t).map(n=>fold(n)));
    for(const [en,es] of catPairs(t)){
      const from=to==='es'?en:es, nn=to==='es'?es:en; if(fold(from)===fold(nn)) continue;
      const cur=catNames(t).find(n=>fold(n)===fold(from)); if(!cur) continue;
      if(have().has(fold(nn))) continue;   /* the other name is already taken: leave both as they are */
      renameCatCore(t,cur,nn); done.push([t,cur,nn]);
    }
  }
  if(done.length){ markDirty('config/categories'); markDirty('config/keywords'); bump(); }
  return done;
}
function undoTranslate(done){
  for(const [t,from,nn] of done.slice().reverse()){ if(catNames(t).includes(nn)&&!catNames(t).includes(from)) renameCatCore(t,nn,from); }
  markDirty('config/categories'); markDirty('config/keywords'); bump(); render();
}

/* charts */
function niceRange(lo,hi,count){
  if(!(hi>lo)){ hi=lo+1; }
  const raw=(hi-lo)/count, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p;
  const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
  const top=Math.ceil(hi/step-1e-9)*step, bot=Math.floor(lo/step+1e-9)*step; const arr=[];
  for(let v=bot;v<=top+step*1e-6;v+=step) arr.push(+v.toFixed(8));
  return {top,bot,arr};
}
function colPathDown(x,y0,w,h,r){ r=Math.max(0,Math.min(r,w/2,h)); const yb=y0+h; return `M${x},${y0}V${yb-r}Q${x},${yb} ${x+r},${yb}H${x+w-r}Q${x+w},${yb} ${x+w},${yb-r}V${y0}Z`; }
function colPath(x,yTop,w,h,r){ r=Math.max(0,Math.min(r,w/2,h)); const yb=yTop+h; return `M${x},${yb}V${yTop+r}Q${x},${yTop} ${x+r},${yTop}H${x+w-r}Q${x+w},${yTop} ${x+w},${yTop+r}V${yb}Z`; }
function mmCat(A){ const c=S.ui.mm.cat, t=S.ui.mm.table; return c&&t!=='all'&&A[t]&&A[t].rows.has(c)?c:null; }
function mmValues(A,t,idx,cat){ const src=cat?A[t].rows.get(cat):A[t].total; return idx.map(i=>r2(t==='expenses'?-src[i]:src[i])); }
/* least-squares line through {x,v} points; x0..x1 is the stretch it is drawn over */
function linFitXY(pts){
  const n=pts.length; if(n<2) return null;
  const xm=sum(pts.map(p=>p.x))/n, ym=sum(pts.map(p=>p.v))/n; let num=0,den=0;

/* How much of what's left to the goal would have to come from growth of the invested money
   (investments + illiquid + retirement), after counting the saving pace; as an amount, a total % and a yearly %. */
function goalGrowthCalc(T,rest,left,pace){

  return {inv,fromSaving,gap,tot,yr};
}

/* years in the Over time chart: the current year by default (or the latest with figures), any mix on request */
function nwYearsAll(){ return [...new Set(nwMonths().map(k=>+k.slice(0,4)))].sort((a,b)=>a-b); }
function nwYearsSel(){ const all=nwYearsAll(); let sel=(S.ui.nw.years||[]).filter(y=>all.includes(y)); if(!sel.length&&all.length){ const cy=nowYM().y; sel=[all.includes(cy)?cy:all[all.length-1]]; } return sel.sort((a,b)=>a-b); }

function nwChartMonths(){ const ys=nwYearsSel(), ms=nwMonths().filter(k=>ys.includes(+k.slice(0,4))); if(!ms.length) return [];

    for(const {a,first} of nwLater(k)) if(h.has(a.id)&&!later.has(a.id)) later.set(a.id,{a,first});
    for(const id of nwState(k).missing) if(h.has(id)){ if(!gaps.has(id)) gaps.set(id,[]); gaps.get(id).push(k); } }
  if(!later.size&&!gaps.size) return '';

  const lines=[...[...later.values()].map(({a,first})=>`<li>${esc(L('nwLaterLine',a.name,ymIn(first)))}${cw?` <button type="button" class="linkish" data-action="nw-from" data-id="${a.id}" data-k="${first}">${esc(L('nwDidntExist'))}</button>`:''}</li>`),
    ...[...gaps.entries()].map(([id,ks])=>`<li>${esc(L('nwGapLine',nm(id),listJoin(ks.map(k=>ymIn(k)))))}</li>`)];
  return `<div class="nw-faded"><p>${esc(L('nwFaded'))}</p><ul>${lines.join('')}</ul>${cw?`<button class="btn sm" type="button" data-action="nw-import">${ICON.xl}${esc(L('nwFillExcel'))}</button>`:''}</div>`;

const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();

function zipStore(files){

    const nb=enc.encode(name), data=enc.encode(text), crc=crc32(data);

    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nb.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nb,data);

    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,0,true); c.setUint16(14,0x5C21,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nb.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nb);
    off+=30+nb.length+data.length;

  const cl=cen.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));

  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:XLSX_MIME});
}

    flush();

/* results of several requests -> one result, as if it had been a single answer */
function aiMerge(rs){
  if(rs.length===1) return rs[0];
  const out={rows:[],left_out:[],statements:[],accounts:[],notes:''}, st=new Map(), ac=new Map(), notes=[];
  for(const r of rs){
    if(Array.isArray(r.rows)) out.rows.push(...r.rows);
    if(Array.isArray(r.left_out)) out.left_out.push(...r.left_out);
    for(const s of Array.isArray(r.statements)?r.statements:[]){ if(!s) continue; const k=String(s.source||''), c=st.get(k);
      if(!c) st.set(k,Object.assign({},s)); else { if(c.opening==null) c.opening=s.opening; if(s.closing!=null) c.closing=s.closing; } }
    for(const a of Array.isArray(r.accounts)?r.accounts:[]){ if(!a||!Array.isArray(a.balances)) continue; const k=a.match||String(a.name||'').trim().toLowerCase(), c=ac.get(k);
      if(!c) ac.set(k,Object.assign({},a,{balances:a.balances.slice()})); else c.balances=c.balances.filter(b=>!a.balances.some(x=>x[0]===b[0])).concat(a.balances); }
    if(typeof r.notes==='string'&&r.notes.trim()&&!notes.includes(r.notes.trim())) notes.push(r.notes.trim());
  }
  out.statements=[...st.values()]; out.accounts=[...ac.values()]; out.notes=notes.join(' ');
  return out;
}
/* one request; if the answer comes back cut off, the same text is sent again in two halves */
async function aiRunJob(m,job,i,n,depth){
  const prompt=aiPrompt(m.mode,m.rules,job.files,aiContext(m.mode));
  const hit=m.cache&&m.cache.get(prompt); if(hit) return hit;
  const lim=await S.ai.limits().catch(()=>null);
  if(job.images.length){ if(!lim||!lim.images) throw {local:L('aiNoImages')}; if(job.images.length>lim.images.maxCount) throw {local:L('aiTooManyImages',lim.images.maxCount)}; }
  const say=s=>{ if(S.modal!==m) return; m.phase=s; const el=$('#ai-phase'); if(el) el.textContent=s; };
  say(n>1?L('aiPart',i+1,n):L('aiAsking'));
  try{
    const res=await S.ai.json(prompt,{signal:m.ctl.signal,cache:false,images:job.images.length?job.images:undefined,
      onText:({text})=>say((n>1?L('aiPart',i+1,n)+' ':'')+L('aiWriting',fmtCount(text.length))),
      onRetry:({attempt,max})=>say(L('aiRetry',attempt,max))});
    if(!m.cache) m.cache=new Map(); m.cache.set(prompt,res); return res;
  }catch(e){
    if(e&&/^(output_truncated|invalid_json|prompt_too_large)$/.test(e.code)&&depth<3&&job.chars>2000){
      const halves=aiJobs(job.files,Math.ceil(job.chars/2),AI_CHUNK_IMAGES), rs=[];
      if(halves.length>1){ for(const h of halves) rs.push(await aiRunJob(m,h,i,n,depth+1)); return aiMerge(rs); }

  }
}
async function aiRun(){

function heatStyle(v,st){
  if(Math.abs(v)<0.005||!st) return '';
  const {min,mid,max}=st; let a,b,t;
  if(v<=mid){ a='--heat-lo'; b='--heat-mid'; t=mid-min>1e-9?(v-min)/(mid-min):1; }
  else { a='--heat-mid'; b='--heat-hi'; t=max-mid>1e-9?(v-mid)/(max-mid):1; }

  return ` style="background:color-mix(in srgb,var(${b}) ${(t*100).toFixed(1)}%,var(${a}))"`;
}

/* ───────── category guesses ─────────
   A small model learned from your own categorised transactions, one per table. Each description is cut into
   short letter sequences (2 to 5 letters inside each word, digits dropped), weighted by how rare they are
   (tf-idf), and a multinomial logistic regression learns which sequences point to which category.
   It is only asked when no keyword matches: keywords always win. It retrains by itself when your data changes. */
const ML_MIN_ROWS=12, ML_SURE=0.8, ML_MAYBE=0.45, ML_SIM_SURE=0.3, ML_SIM_MAYBE=0.2;
function mlOn(){ return !(S.settings&&S.settings.mlGuess===false); }
const mlNorm=s=>fold(s).replace(/\d+/g,' ').replace(/[^a-z ]+/g,' ').replace(/\s+/g,' ').trim();
function mlGrams(s){ const out=new Map(); for(const w of mlNorm(s).split(' ')){ if(!w) continue; const x=' '+w+' ';
  for(let n=2;n<=5;n++) for(let i=0;i+n<=x.length;i++){ const g=x.substr(i,n); out.set(g,(out.get(g)||0)+1); } } return out; }
function mlVec(grams,M){ const idx=[], val=[]; let nn=0;
  for(const [g,c] of grams){ const f=M.fi.get(g); if(f==null) continue; const v=(1+Math.log(c))*M.idf[f]; idx.push(f); val.push(v); nn+=v*v; }
  nn=Math.sqrt(nn)||1; for(let i=0;i<val.length;i++) val[i]/=nn; return {idx,val}; }
function mlRows(t){ return allRows().filter(r=>r.table===t&&isKnown(t,r.category)&&mlNorm(r.concept)); }
function mlTrain(t,rows){
  const cls=[...new Set(rows.map(r=>r.category))];
  if(rows.length<ML_MIN_ROWS||cls.length<2) return null;
  const G=rows.map(r=>mlGrams(r.concept)), df=new Map();
  for(const g of G) for(const k of g.keys()) df.set(k,(df.get(k)||0)+1);
  const fi=new Map(); let F=0; for(const k of df.keys()) fi.set(k,F++);
  const N=rows.length, idf=new Float64Array(F); for(const [k,i] of fi) idf[i]=Math.log((1+N)/(1+df.get(k)))+1;
  const K=cls.length, ci=new Map(cls.map((c,i)=>[c,i])), M={t,cls,K,fi,idf};
  const X=G.map(g=>mlVec(g,M)), Y=rows.map(r=>ci.get(r.category));
  const W=new Float64Array(F*K), G2=new Float64Array(F*K).fill(1e-8), b=new Float64Array(K), gb=new Float64Array(K).fill(1e-8), z=new Float64Array(K);
  const lr=0.5, l2=1e-5; let seed=7; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const order=X.map((_,i)=>i);
  for(let ep=0;ep<10;ep++){
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const s=order[i]; order[i]=order[j]; order[j]=s; }
    for(const i of order){ const x=X[i], y=Y[i]; let mx=-Infinity;
      for(let k=0;k<K;k++){ let s=b[k]; for(let q=0;q<x.idx.length;q++) s+=W[x.idx[q]*K+k]*x.val[q]; z[k]=s; if(s>mx) mx=s; }
      let se=0; for(let k=0;k<K;k++){ z[k]=Math.exp(z[k]-mx); se+=z[k]; }
      for(let k=0;k<K;k++){ const g=z[k]/se-(k===y?1:0);
        gb[k]+=g*g; b[k]-=lr*g/Math.sqrt(gb[k]);
        for(let q=0;q<x.idx.length;q++){ const p=x.idx[q]*K+k, gg=g*x.val[q]+l2*W[p]; G2[p]+=gg*gg; W[p]-=lr*gg/Math.sqrt(G2[p]); } } } }
  return Object.assign(M,{W,b,X,Y,concepts:rows.map(r=>r.concept),n:N});
}
/* trained once per table and kept until the categorised transactions (or the categories) change */
const mlCache={};
function mlModel(t){ if(!mlOn()) return null; return memo('ml'+t,()=>{
  const rows=mlRows(t); let h=0; for(const r of rows){ const s=r.concept+'|'+r.category; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; }
  const sig=rows.length+':'+h+':'+catNames(t).join('|');
  if(mlCache[t]&&mlCache[t].sig===sig) return mlCache[t].model;
  const model=mlTrain(t,rows); mlCache[t]={sig,model}; return model; }); }
/* the best guess for a description: {cat, p (0-1), like: the most similar past transaction in that category, sim: how similar (0-1)} */
function mlGuess(t,concept){
  const M=mlModel(t); if(!M||!mlNorm(concept)) return null;
  const x=mlVec(mlGrams(concept),M); if(!x.idx.length) return null;
  const K=M.K, z=new Float64Array(K); let mx=-Infinity;
  for(let k=0;k<K;k++){ let s=M.b[k]; for(let q=0;q<x.idx.length;q++) s+=M.W[x.idx[q]*K+k]*x.val[q]; z[k]=s; if(s>mx) mx=s; }
  let se=0, j=0; for(let k=0;k<K;k++){ z[k]=Math.exp(z[k]-mx); se+=z[k]; if(z[k]>z[j]) j=k; }
  const cat=M.cls[j]; if(!isKnown(t,cat)) return null;
  const xm=new Map(x.idx.map((f,i)=>[f,x.val[i]])); let like=null, best=0;
  M.X.forEach((v,i)=>{ if(M.Y[i]!==j) return; let s=0; for(let q=0;q<v.idx.length;q++){ const w=xm.get(v.idx[q]); if(w) s+=w*v.val[q]; } if(s>best){ best=s; like=M.concepts[i]; } });
  return {cat,p:z[j]/se,like,sim:best};
}
/* sure: filled in on import (marked); maybe: offered as a question. A guess must also look like a past transaction,
   so a description that shares only a few letters with your history ("FOOBAR" vs "BAR …") isn't guessed. */
function mlLevel(g){ if(!g) return null; if(g.p>=ML_SURE&&g.sim>=ML_SIM_SURE) return 'sure'; if(g.p>=ML_MAYBE&&g.sim>=ML_SIM_MAYBE) return 'maybe'; return null; }
function mlLearnedCount(){ return TKEYS.reduce((a,t)=>{ const M=mlModel(t); return a+(M?M.n:0); },0); }
/* an import row with no keyword: a confident guess fills the category (marked), a weaker one is offered */
function impGuess(r){ r.ml=null; r.maybe=null; if(r.category||r.dup) return; const g=mlGuess(r.table,r.concept); if(!g) return;
  const lv=mlLevel(g); if(lv==='sure'){ r.category=g.cat; r.ml=g; } else if(lv==='maybe') r.maybe=g; }
function sugHtml(d){

function findHeader(rows){

    const cols={date:-1,amount:-1,debit:-1,credit:-1,category:-1,bal:-1,cur:-1,concept:[],concept2:[]}; let vdate=-1;
    rows[i].forEach((raw,c)=>{ const h=String(raw==null?'':raw).trim(); if(!h) return;

      if(HDR.currency.test(h)){ if(cols.cur<0) cols.cur=c; return; }
      if(HDR.skip.test(h)) return;
      if(HDR.valueDate.test(h)){ if(vdate<0) vdate=c; return; }
      if(cols.date<0&&HDR.date.test(h)) cols.date=c;
      else if(cols.amount<0&&HDR.amount.test(h)) cols.amount=c;
      else if(cols.debit<0&&HDR.debit.test(h)) cols.debit=c;
      else if(cols.credit<0&&HDR.credit.test(h)) cols.credit=c;
      else if(cols.category<0&&HDR.category.test(h)) cols.category=c;

      else if(HDR.concept2.test(h)) cols.concept2.push(c); });

function parseCSV(text){
  text=String(text).replace(/^\uFEFF/,'');

  const count=(l,ch)=>{ let n=0,q=false; for(const c of l){ if(c==='"') q=!q; else if(c===ch&&!q) n++; } return n; };
  /* the separator is the one that splits most lines into the same number of cells; title lines above the header don't count against it */
  const need=Math.min(lines.length,Math.max(2,Math.ceil(0.6*lines.length)));
  const score=ch=>{ const f=new Map(); for(const l of lines){ const c=count(l,ch); if(c>0) f.set(c,(f.get(c)||0)+1); } let top=0; for(const v of f.values()) if(v>top) top=v; return top; };
  const sc=['\t',';',','].map(ch=>[ch,score(ch)]);
  let delim=(sc.find(x=>x[1]>=need)||[''])[0];
  if(!delim){ let best=0; for(const [ch,v] of sc) if(v>=2&&v>best){ best=v; delim=ch; } }
  if(!delim) return text.split(/\r?\n/).filter(l=>l.trim()).map(splitLine);
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"'&&cell.trim()==='') { q=true; cell=''; }
    else if(c===delim){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()));
}

function parseCells(cells,table){
  cells=cells.map(c=>c==null?'':c);
  let date=null,di=-1;
  for(let i=0;i<cells.length;i++){ const d=parseDate(cells[i]); if(d){ date=d; di=i; break; } }
  if(!date) return null;
  let amount=null,ai=-1;
  for(let i=0;i<cells.length;i++){ if(i===di) continue; const v=cells[i]; if(v===''||v==null) continue; const a=parseAmount(v); if(a!==null){ amount=a; ai=i; break; } }
  if(amount===null) return {err:true};
  const rest=cells.filter((_,i)=>i!==di&&i!==ai).map(c=>String(c).trim()).filter(Boolean);
  let category=''; const names=table==='auto'?TKEYS.flatMap(catNames):catNames(table); const words=[];
  for(const s of rest){ if(!category&&names.includes(s)) { category=s; continue; } if(ALL_MONTH_NAMES.has(s.toLowerCase())||/^\d{4}$/.test(s)) continue; words.push(s); }
  return {date,amount,concept:words.join(' ').replace(/\s+/g,' ').trim(),category,fx:foreignCode(typeof cells[ai]==='string'?cells[ai]:null,CUR)};
}
/* which table an imported row belongs to: money out is an expense unless an investment keyword says otherwise;
   money in is income unless only an expense keyword (a refund) or an investment keyword (a withdrawal) matches */
function guessTable(p){
  const ok=(t,m)=>m&&isKnown(t,m.cat);
  if(p.amount<0){
    if(p.category){ for(const t of ['expenses','investments']) if(isKnown(t,p.category)) return t; }
    const e=matchKeyword('expenses',p.concept), v=matchKeyword('investments',p.concept);
    return ok('investments',v)&&(!ok('expenses',e)||v.k.length>e.k.length)?'investments':'expenses';
  }
  if(p.category){ for(const t of TKEYS) if(isKnown(t,p.category)) return t; }
  for(const t of TKEYS) if(ok(t,matchKeyword(t,p.concept))) return t;
  return 'income';
}
function autoCat(r,raw){ if(raw&&isKnown(r.table,raw)) return raw; const mt=matchKeyword(r.table,r.concept); return mt&&isKnown(r.table,mt.cat)?mt.cat:''; }
function setImpTable(r,t){ if(!TKEYS.includes(t)||r.table===t) return; r.table=t; r.guessed=false; if(!r.manual||!isKnown(t,r.category)){ r.manual=false; r.category=autoCat(r,''); impGuess(r); } }
/* checks on the rows read, before anything is saved:
   - a pair with the same amount out and in within 3 days, where one side says "transfer", is money moved between your own accounts: unticked
   - if the file has a running balance column and it follows the rows, any row that doesn't follow from the one before is marked */
const XFER_RE=/\b(transfer|transferencia|transf|traspaso|trf|tfr|own account|between accounts|entre cuentas|cuenta propia|savings|ahorros?|internal)\b/;
const dayNum=iso=>Math.round(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))/86400000);
function importChecks(rows){
  const out={xfer:0,like:0,odd:0,fx:0,fxCodes:'',bal:null};
  const cand=rows.map((r,i)=>i).filter(i=>rows[i].on&&Math.abs(rows[i].amount)>=1);
  const used=new Set();
  for(const i of cand){ if(used.has(i)) continue; const a=rows[i]; let best=-1,bd=99;
    for(const j of cand){ if(j===i||used.has(j)) continue; const b=rows[j];
      if(Math.abs(a.amount+b.amount)>0.005||a.amount===b.amount) continue;
      if(!XFER_RE.test(loose(a.concept))&&!XFER_RE.test(loose(b.concept))) continue;
      const d=Math.abs(dayNum(a.date)-dayNum(b.date)); if(d<=3&&d<bd){ best=j; bd=d; } }
    if(best>-1){ used.add(i); used.add(best); for(const k of [i,best]){ rows[k].xfer=true; rows[k].on=false; } out.xfer+=2; } }
  out.like=rows.filter(r=>r.like&&!r.dup).length;
  /* far larger than anything usual for the category (over 3 times its 90th percentile, 8 or more saved rows to judge by) */
  const hist=new Map(); for(const r of allRows()){ if(!isKnown(r.table,r.category)) continue; const k=r.table+'|'+r.category; if(!hist.has(k)) hist.set(k,[]); hist.get(k).push(Math.abs(r.amount)); }
  out.odd=0;
  for(const r of rows){ if(!r.on||!r.category) continue; const h=hist.get(r.table+'|'+r.category); if(!h||h.length<8) continue;
    const srt=h.slice().sort((a,b)=>a-b); if(Math.abs(r.amount)>3*percentileInc(srt,0.9)&&Math.abs(r.amount)>=50){ r.odd=percentileInc(srt,0.5); out.odd++; } }
  const fxr=rows.filter(r=>r.fx&&r.on); out.fx=fxr.length; out.fxCodes=[...new Set(fxr.map(r=>r.fx))].join(', ');
  const withBal=rows.filter(r=>r.bal!=null);
  if(withBal.length>=4&&withBal.length>=0.7*rows.length){
    const run=list=>{ let ok=0; const bad=[]; for(let i=1;i<list.length;i++){ if(Math.abs(r2(list[i].bal-list[i-1].bal)-list[i].amount)<=0.011) ok++; else bad.push(list[i]); } return {ok,bad}; };
    const up=run(withBal), down=run(withBal.slice().reverse()), best=up.ok>=down.ok?up:down, steps=withBal.length-1;
    if(best.ok>=0.6*steps){ for(const r of best.bad) r.balOff=true; out.bal={steps,ok:best.ok,bad:best.bad.length}; }
  }
  return out;
}

function finishImport(parsed,bad,fileName){
  /* a row already in the tracker (same date, amount and description, in any table) arrives unticked */
  const key=r=>[r.date,r2(r.amount).toFixed(2),fold(r.concept).replace(/\s+/g,' ').trim()].join('|');
  const exist=new Map(); for(const r of allRows()){ const k=key(r); exist.set(k,(exist.get(k)||0)+1); }
  const seen=new Map();
  const sameDA=new Map(); for(const r of allRows()){ const k=r.date+'|'+r2(r.amount).toFixed(2); if(!sameDA.has(k)) sameDA.set(k,[]); sameDA.get(k).push({c:r.concept,f:fold(r.concept).replace(/\s+/g,' ').trim()}); }
  const rows=parsed.map(p=>{
    const k=key(p); const n=(seen.get(k)||0)+1; seen.set(k,n);
    const dup=n<=(exist.get(k)||0);
    const skip=dup?null:skipMatch(p.concept);
    const guessed=p.table==='auto';
    const r=Object.assign({},p,{table:guessed?guessTable(p):p.table,guessed,dup,skip,on:!dup&&!skip,manual:false});
    r.category=autoCat(r,p.category); impGuess(r);
    /* same day and amount as a saved row under another description: kept ticked, but pointed out */
    const la=sameDA.get(p.date+'|'+r2(p.amount).toFixed(2));
    if(la&&la.length){ const fi=la.findIndex(x=>x.f===fold(p.concept).replace(/\s+/g,' ').trim()); if(fi>-1) la.splice(fi,1); else if(!dup){ r.like=la.shift().c; } }
    return r;
  });
  const checks=importChecks(rows);
  if(!rows.length){ S.modal.msg=bad.length?L('noDateAmount'):L('nothingToRead'); renderModal(); return; }
  Object.assign(S.modal,{step:'preview',rows,bad,fileName,wide:true,msg:'',confirmClose:false,checks}); renderModal();
}

/* "Always put MERCADONA in Groceries?": after a category is picked by hand, offer a keyword for next time */
const KW_STOP=new Set(('compra compras tarj tarjeta tarjet pago pagos card payment payments purchase contactless online pos visa mastercard debit debito credito recibo recibos cargo cargos adeudo abono transferencia transfer trf tfr bizum enviado enviada recibido recibida emitida '
  +'traspaso devolucion reembolso refund reintegro aportacion comision liquidacion domiciliacion cuota factura invoice pedido order ingreso cobro apunte movimiento operacion cuenta '
  +'direct standing faster de del la las los el en al the to from at in of on por para con sepa paypal www com es net org sl sa slu ltd inc gmbh bv plc ref num fecha concepto').split(' '));
function kwSuggestion(concept){
  const toks=fold(concept).replace(/[*_|\\]+/g,' ').split(/[\s,;:()"']+/);
  for(let w of toks){
    w=w.replace(/^[^a-z0-9&]+|[^a-z0-9&]+$/g,'');
    if(w.length<3||KW_STOP.has(w)) continue;
    if(/x{3,}|\d{3,}/.test(w)||!/[a-z]{2}/.test(w)) continue;
    w=w.replace(/\.(com|es|net|org|eu|co\.uk|de|fr|it)(\/.*)?$/,'');
    if(w.length>=3&&!KW_STOP.has(w)) return w;
  }
  return null;
}
function offerKeyword(t,concept,cat){
  if(!S.canWrite||!isKnown(t,cat)) return;
  const k=kwSuggestion(concept), kl=k&&loose(k); if(!k||!kl||!hasKw(loose(concept),kl)) return;
  if((kws()[t]||[]).some(q=>loose(q[0])===kl)) return;
  const cur=matchKeyword(t,concept); if(cur&&(cur.cat===cat||cur.k.length>=kl.length)) return;
  const fc=foldedConcepts(); let n=0;
  allRows().forEach((r,i)=>{ if(r.table===t&&!isKnown(t,r.category)&&hasKw(fc[i],kl)) n++; });
  if(S.modal&&S.modal.type==='import'&&S.modal.rows) n+=S.modal.rows.filter(r=>r.table===t&&!r.category&&hasKw(loose(r.concept),kl)).length;
  toast(L('alwaysQ',k,cat),{label:n?L('alwaysYesN',n):L('alwaysYes'),fn:()=>addKwAndFill(t,k,cat)},10000);
}
function addKwAndFill(t,k,cat){
  const K=ensureKw(); if(!K[t].some(q=>fold(q[0])===fold(k))) K[t].push([k,cat]);
  markDirty('config/keywords'); bump();
  let n=0;
  if(S.modal&&S.modal.type==='import'&&S.modal.rows){ for(const r of S.modal.rows) if(r.table===t&&!r.category){ const c=autoCat(r,''); if(c){ r.category=c; n++; } } renderModalKeepScroll(); }
  n+=categoriseBlanks(t).filled;
  render(); toast(L('kwAddedFilled',k,cat,n));
}

async function readKeywordFile(file){
  const m=S.modal; if(!m||m.type!=='kwimport') return;
  let X; try{ X=await getXLSX(); }catch(e){ m.msg=L('readerFail'); renderModal(); return; }
  let wb; try{ wb=X.read(await file.arrayBuffer(),{type:'array'}); }catch(e){ m.msg=L('notSpreadsheet'); renderModal(); return; }
  const tables={};
  const WHY={'no keyword':'why_noKw','no category':'why_noCat','bad':'why_badCat','twice':'why_twice'};
  for(const name of wb.SheetNames){
    const t=kwSheetTable(name); if(!t||tables[t]) continue;
    const aoa=X.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''});
    const hi=aoa.findIndex((r,i)=>i<20&&['keyword','palabra clave'].includes(String(r[0]).trim().toLowerCase()));
    if(hi<0){ tables[t]={sheet:name,error:L('kwNoHeader')}; continue; }
    const canon=new Map(catNames(t).map(c=>[c.toLowerCase(),c]));
    const rows=[], skipped=[], seen=new Map();
    for(let i=hi+1;i<aoa.length;i++){
      const kw=String(aoa[i][0]==null?'':aoa[i][0]).trim(), raw=String(aoa[i][1]==null?'':aoa[i][1]).trim();
      if(!kw&&!raw) continue;
      if(!kw){ skipped.push({line:i+1,kw:'',cat:raw,why:WHY['no keyword']}); continue; }
      const cat=canon.get(raw.toLowerCase());
      if(!cat){ skipped.push({line:i+1,kw,cat:raw,why:raw?WHY.bad:WHY['no category']}); continue; }
      const lk=kw.toLowerCase();
      if(seen.has(lk)){ if(seen.get(lk)!==cat) skipped.push({line:i+1,kw,cat,why:WHY.twice}); continue; }
      seen.set(lk,cat); rows.push([kw,cat]);
    }
    const old=kws()[t]||[], o=new Map(old.map(p=>[p[0].toLowerCase(),p])), n=new Map(rows.map(p=>[p[0].toLowerCase(),p]));
    tables[t]={sheet:name,rows,skipped,
      added:rows.filter(p=>!o.has(p[0].toLowerCase())),
      removed:old.filter(p=>!n.has(p[0].toLowerCase())),
      changed:rows.filter(p=>o.has(p[0].toLowerCase())&&o.get(p[0].toLowerCase())[1]!==p[1]).map(p=>({k:p[0],from:o.get(p[0].toLowerCase())[1],to:p[1]})),
      before:old.length};
  }
  if(!Object.keys(tables).length){ m.msg=L('kwNoSheets'); renderModal(); return; }
  Object.assign(m,{step:'preview',tables,fileName:file.name,wide:true,msg:''}); renderModal();
}

  const warn=`<div class="notice danger">${ICON.warn.replace('<svg','<svg width="18" height="18"')}<span><b>${esc(L('kwWarnTitle'))}</b> ${esc(L('kwWarnText'))}</span></div>`;
  if(m.step==='input') return `${mHead(esc(L('kwImpTitle')),esc(L('kwImpSub')))}
  <div class="m-body">
    ${warn}
    <ol class="steps">
      <li>${S.downloads?`<button type="button" class="linkish" data-action="kw-download">${esc(L('kwStep1'))}</button>`:esc(L('kwStep1'))} ${esc(L('kwStep1b'))}</li>
      <li>${esc(L('kwStep2'))}</li>
      <li>${esc(L('kwStep3'))}</li>
    </ol>
    <div class="drop" id="kwimp-drop"><span>${esc(L('kwChoose'))}</span>
      <label class="btn sm" for="kwimp-file">${esc(L('chooseFile'))}</label><input type="file" id="kwimp-file" accept=".xlsx,.xlsm,.xls" class="sr"></div>
    ${m.msg?`<p class="field"><span class="err">${esc(m.msg)}</span></p>`:''}
  </div>
  <div class="m-foot"><span class="r"><button class="btn" data-action="close">${esc(L('cancel'))}</button></span></div>`;
  let anyChange=false, anyEmpty=false;
  const secs=TKEYS.map(t=>{
    const d=m.tables[t];
    if(!d) return `<section class="kwd-sec"><h4><i class="sw ${t}"></i>${esc(TL(t))}</h4><p class="hint">${esc(L('kwNotInFile',(kws()[t]||[]).length))}</p></section>`;
    if(d.error) return `<section class="kwd-sec"><h4><i class="sw ${t}"></i>${esc(TL(t))}</h4><p class="err">${esc(d.error)}</p></section>`;
    const ch=d.added.length+d.removed.length+d.changed.length; if(ch) anyChange=true;
    const empties=d.rows.length===0&&d.before>0; if(empties) anyEmpty=true;
    return `<section class="kwd-sec"><h4><i class="sw ${t}"></i>${esc(TL(t))} <span class="hint">${esc(L('kwCount',fmtCount(d.before),fmtCount(d.rows.length)))}</span></h4>
      ${empties?`<p class="err">${esc(L('kwDelAll',tl(t)))}</p>`:''}
      ${ch?`<div class="kwd-chips">${d.removed.length?`<span class="kchip del">${esc(L('kwDeleted',fmtCount(d.removed.length)))}</span>`:''}${d.added.length?`<span class="kchip add">${esc(L('kwNew',fmtCount(d.added.length)))}</span>`:''}${d.changed.length?`<span class="kchip chg">${esc(L('kwNewCat',fmtCount(d.changed.length)))}</span>`:''}</div>`:`<p class="hint">${esc(L('noChanges'))}</p>`}
      ${d.removed.length?`<details open><summary>${esc(L('deletedH'))}</summary>${kwList(d.removed,p=>`<span class="kw">${esc(p[0])}</span> <span class="hint">${esc(p[1])}</span>`,'del')}</details>`:''}
      ${d.added.length?`<details ${d.added.length<=15?'open':''}><summary>${esc(L('newH'))}</summary>${kwList(d.added,p=>`<span class="kw">${esc(p[0])}</span> → ${esc(p[1])}`)}</details>`:''}
      ${d.changed.length?`<details ${d.changed.length<=15?'open':''}><summary>${esc(L('newCatH'))}</summary>${kwList(d.changed,x=>`<span class="kw">${esc(x.k)}</span> ${esc(x.from)} → <b>${esc(x.to)}</b>`)}</details>`:''}
      ${d.skipped.length?`<details open><summary class="warn-text">${esc(L('cantImport',d.skipped.length))}</summary>${kwList(d.skipped,x=>`${esc(L('rowN',x.line))}: <span class="kw">${esc(x.kw||L('blank'))}</span> ${x.cat?esc(quote(x.cat)):''} <span class="hint">· ${esc(L(x.why))}</span>`)}</details>`:''}
    </section>`;
  }).join('');
  return `${mHead(esc(L('kwCheckTitle')),esc(m.fileName||''))}
  <div class="m-body">
    ${warn}
    <p class="hint">${esc(L('kwNothingYet'))}</p>
    ${secs}
  </div>
  <div class="m-foot"><button class="btn" data-action="kwimp-back">${esc(L('back'))}</button><span class="r"><button class="btn" data-action="close">${esc(L('cancel'))}</button><button class="btn ${anyEmpty?'danger solid':'primary'}" data-action="kwimp-apply" ${anyChange?'':'disabled'}>${esc(L('replaceKw'))}</button></span></div>`;
}
function applyKeywordImport(){
  const m=S.modal; if(!m||!m.tables) return;
  const K=ensureKw(), before=clone(K); let add=0,del=0,chg=0;
  for(const t of TKEYS){ const d=m.tables[t]; if(!d||d.error) continue; K[t]=d.rows.map(p=>[p[0],p[1]]); add+=d.added.length; del+=d.removed.length; chg+=d.changed.length; }
  markDirty('config/keywords'); bump(); closeModal(); render();
  const parts=[]; if(add) parts.push(L('kwNew',fmtCount(add))); if(del) parts.push(L('kwDeleted',fmtCount(del))); if(chg) parts.push(L('kwRecat',fmtCount(chg)));
  toast(L('kwReplaced',parts.join(', ')),{label:L('undo'),fn:()=>{ S.kw=before; markDirty('config/keywords'); bump(); render(); toast(L('kwRestored')); }});
}

function modalDelCat(){
  const m=S.modal, t=m.t;
  const nTx=allRows().filter(r=>r.table===t&&r.category===m.name).length, nKw=(kws()[t]||[]).filter(p=>p[1]===m.name).length;
  return `${mHead(esc(L('delCatQ',m.name)),esc(L('catOfTable',TL(t))))}
  <div class="m-body">
    <p>${esc(nTx||nKw?L('catUsedBy',nTx,nKw):L('catUnused'))}</p>
    ${nTx||nKw?`<div class="field"><label for="dc-to">${esc(L('moveTo'))}</label><select id="dc-to"><option value="">${esc(L('moveNowhere'))}</option>${catNames(t).filter(n=>n!==m.name).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div>`:''}
  </div><div class="m-foot"><span class="r"><button class="btn" data-action="close">${esc(L('cancel'))}</button><button class="btn danger solid" data-action="delcat-yes">${esc(L('delCategory'))}</button></span></div>`;
}

/* ───────── export ───────── */
function serial(iso){ return (Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))-Date.UTC(1899,11,30))/86400000; }
async function exportXlsx(){
  if(!S.downloads) return;
  let X; try{ X=await getXLSX(); }catch(e){ toast(L('writerFail')); return; }
  const wb=X.utils.book_new();
  for(const t of TKEYS){
    const rows=allRows().filter(r=>r.table===t).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.ord-b.ord);
    const aoa=[[L('h_date'),L('h_amount'),L('h_concept'),L('h_category'),L('h_month'),L('h_year')],...rows.map(r=>[serial(r.date),r.amount,r.concept,r.category,M()[+r.date.slice(5,7)-1],+r.date.slice(0,4)])];
    const ws=X.utils.aoa_to_sheet(aoa);
    for(let i=1;i<aoa.length;i++){ const a=X.utils.encode_cell({r:i,c:0}); ws[a].z='dd/mm/yyyy'; const b=X.utils.encode_cell({r:i,c:1}); ws[b].z='#,##0.00'; }
    ws['!cols']=[{wch:12},{wch:12},{wch:50},{wch:26},{wch:11},{wch:7}];
    X.utils.book_append_sheet(wb,ws,sheetName(t));
  }
  const y=S.ui.year, A=agg(y);
  const sumAoa=[[String(y),...M(),L('total')]];
  for(const t of TKEYS){ sumAoa.push([TL(t)]); for(const n of catRowsFor(A,t)){ const a=A[t].rows.get(n); sumAoa.push([dispCat(n),...a,r2(sum(a))]); } sumAoa.push([L('total'),...A[t].total,r2(sum(A[t].total))]); sumAoa.push([]); }
  sumAoa.push([L('totalSavings'),...A.savings,r2(sum(A.savings))]);
  const sws=X.utils.aoa_to_sheet(sumAoa); sws['!cols']=[{wch:26},...M().map(()=>({wch:11})),{wch:12}];
  X.utils.book_append_sheet(wb,sws,L('sh_yearly',y));
  const cAoa=[[L('table'),L('h_category'),L('nwHead'),L('limitHead')],...TKEYS.flatMap(t=>cats()[t].map(c=>[TL(t),c.name,t==='expenses'?nwLabel(c.type||'Want'):'',t==='expenses'&&limitFor(c.name)?limitFor(c.name):'']))];
  X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(cAoa),L('sh_cats'));
  if(nwMonths().length){
    const accs=nw().accounts, nAoa=[[L('month'),...accs.map(a=>a.name),L('total')],...nwMonths().map(k=>{ const s=nw().snaps[k]; return [ymLabel(k,true),...accs.map(a=>s[a.id]!=null?s[a.id]:''),nwTotals(k).total]; })];
    const nws=X.utils.aoa_to_sheet(nAoa); nws['!cols']=[{wch:16},...accs.map(()=>({wch:16})),{wch:14}];
    X.utils.book_append_sheet(wb,nws,L('sh_nw'));
  }
  for(const t of TKEYS) X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([[L('kwHead'),L('h_category')],...(kws()[t]||[])]),'CAT_'+sheetName(t));
  await saveWorkbook(X,wb,`${L('fileBase')} ${stampToday()}.xlsx`,L('sheetSaved'));
}
async function saveWorkbook(X,wb,filename,okMsg){
  const out=X.write(wb,{bookType:'xlsx',type:'array',compression:true});
  try{ await S.downloads.save({filename,data:new Blob([out])}); toast(okMsg); }
  catch(e){ if(e&&e.code==='declined') return; if(e&&e.code==='rate_limited'){ toast(L('saveWaiting')); return; } toast(L('dlFailed')); }
}

async function downloadTemplate(){
  if(!S.downloads) return;
  const bin=atob(TEMPLATE_XLSX[LANG]||TEMPLATE_XLSX.en), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  try{ await S.downloads.save({filename:`${L('fileBase')} ${L('fileTpl')}.xlsx`,data:new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}); toast(L('templateSaved')); }
  catch(e){ if(e&&e.code==='declined') return; if(e&&e.code==='rate_limited'){ toast(L('saveWaiting')); return; } toast(L('dlFailed')); }
}

/* ───────── backups ───────── */
function backupJson(){
  return JSON.stringify({app:'Yearly Budget Tracker',format:1,savedAt:new Date().toISOString(),months:S.months,config:Object.assign({categories:cats(),keywords:kws(),settings:bodyFor('config/settings')},S.nw?{networth:nw()}:{})});
}
async function downloadBackup(){
  if(S.local&&typeof S.local.saveCopy==='function') return localAction('saveCopy');
  if(!S.downloads) return;
  try{ await S.downloads.save({filename:`${L('fileBase')} ${L('fileBackup')} ${stampToday()}.json`,data:new Blob([backupJson()],{type:'application/json'})}); toast(L('backupSaved')); if(S.canWrite){ setSettings({lastBackup:todayYmd()}); render(); } }
  catch(e){ if(e&&e.code==='declined') return; if(e&&e.code==='rate_limited'){ toast(L('saveWaiting')); return; } toast(L('dlFailed')); }
}
function parseBackup(text){
  let d; try{ d=JSON.parse(String(text).replace(/^﻿/,'')); }catch(_){ return null; }
  if(!d||typeof d!=='object'||Array.isArray(d)) return null;
  if(!d.months&&d.db&&typeof d.db==='object') d=d.db;
  const months=d.months; if(!months||typeof months!=='object'||Array.isArray(months)) return null;
  const cfg=d.config&&typeof d.config==='object'?d.config:{categories:d.categories,keywords:d.keywords,settings:d.settings};
  const out={months:{},config:{},savedAt:typeof d.savedAt==='string'?d.savedAt:null};
  for(const [k,v] of Object.entries(months)) if(/^\d{4}-\d{2}$/.test(k)&&v&&typeof v==='object') out.months[k]=normMonth(v);
  for(const k of ['categories','keywords','settings','networth']) if(cfg[k]&&typeof cfg[k]==='object'&&!Array.isArray(cfg[k])) out.config[k]=cfg[k];
  return out;
}
const countDataset=d=>Object.values(d.months).reduce((a,m)=>a+TKEYS.reduce((b,t)=>b+m[t].length,0),0);
async function readBackupFile(file){
  const m=S.modal; if(!m||m.type!=='restore') return;
  let d=null; try{ d=parseBackup(await fileText(file)); }catch(_){ d=null; }
  if(!d){ m.msg=L('notBackup'); renderModal(); return; }
  Object.assign(m,{data:d,fileName:file.name,msg:''}); renderModal();
}
function modalRestore(){
  const m=S.modal, cur=allRows().length;
  if(!m.data) return `${mHead(esc(L('restoreTitle')),esc(L('restoreSub')))}
  <div class="m-body">
    <div class="drop" id="rs-drop"><span>${esc(L('restoreChoose'))}</span>
      <label class="btn sm" for="rs-file">${esc(L('chooseFile'))}</label><input type="file" id="rs-file" accept=".json,application/json" class="sr"></div>
    ${m.msg?`<p class="field"><span class="err">${esc(m.msg)}</span></p>`:''}
  </div>
  <div class="m-foot"><span class="r"><button class="btn" data-action="close">${esc(L('cancel'))}</button></span></div>`;
  const d=m.data, n=countDataset(d), ms=Object.keys(d.months).filter(k=>TKEYS.some(t=>d.months[k][t].length)).sort();
  const ml=k=>M3()[+k.slice(5,7)-1]+' '+k.slice(0,4);
  const a=ms[0], z=ms[ms.length-1];
  const span=!ms.length?'–':ms.length===1?ml(a):a.slice(0,4)===z.slice(0,4)?M3()[+a.slice(5,7)-1]+'–'+ml(z):ml(a)+' – '+ml(z);
  return `${mHead(esc(L('restoreCheck')),esc(m.fileName||''))}
  <div class="m-body">
    <div class="rs-sum">
      <div><span class="eyebrow">${esc(L('bkSaved'))}</span><b>${d.savedAt&&/^\d{4}-\d{2}-\d{2}/.test(d.savedAt)?fmtDate(d.savedAt.slice(0,10)):'–'}</b></div>
      <div><span class="eyebrow">${esc(L('bkTx'))}</span><b>${fmtCount(n)}</b></div>
      <div><span class="eyebrow">${esc(L('bkMonths'))}</span><b>${esc(span)}</b></div>
    </div>
    ${cur?`<div class="notice danger">${ICON.warn.replace('<svg','<svg width="18" height="18"')}<span><b>${esc(L('restoreWarnTitle',cur))}</b> ${esc(L('restoreWarnText'))}</span></div>`:''}
  </div>
  <div class="m-foot">${cur&&S.downloads?`<button class="btn" type="button" data-action="backup">${esc(L('dlCurrentFirst'))}</button>`:''}<span class="r"><button class="btn" type="button" data-action="close">${esc(L('cancel'))}</button><button class="btn ${cur?'danger solid':'primary'}" type="button" data-action="restore-yes">${esc(L('restoreYes',n))}</button></span></div>`;
}

const info=k=>STR['info_'+k]?`<button type="button" class="info-btn" data-info="${k}" aria-label="${esc(L('infoAbout'))}" aria-expanded="false">i</button>`:'';
let infoOpen=null, infoPinned=false, infoTimer=null;
function infoEl(){ let e=document.getElementById('infotip'); if(!e){ e=document.createElement('div'); e.id='infotip'; e.setAttribute('role','tooltip'); e.hidden=true; document.body.appendChild(e); } return e; }
function showInfo(btn,pin){

  TOUR={i:0,fresh:!!(opts&&opts.fresh),hide:HIDE,ui:clone(S.ui),real:{months:S.months,cats:S.cats,kw:S.kw,settings:S.settings,nw:S.nw}};

/* ───────── toast ───────── */
function toast(msg,action,ms){
  const host=$('#toast'); const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`<span>${esc(msg)}</span>${action?`<button type="button">${esc(action.label)}</button>`:''}`;
  if(action) el.querySelector('button').addEventListener('click',()=>{ action.fn(); el.remove(); });
  /* a new notice replaces the old ones; one with an Undo stays until it times out, under the new one */
  for(const o of [...host.children]) if(!o.querySelector('button')) o.remove();
  host.appendChild(el); while(host.children.length>2) host.firstChild.remove();
  setTimeout(()=>el.remove(),ms||(action?7000:3000));
}

  }
  else if(f.id==='nw-snap-form'){

    for(const k of Object.keys(N.snaps)){ for(const id of Object.keys(N.snaps[k])) if(!keep.has(id)) delete N.snaps[k][id]; if(!Object.keys(N.snaps[k]).length) delete N.snaps[k]; }
    saveNw(); closeModal(); render(); toast(L('nwAccSaved'));
  }
  else if(f.id==='nw-ret-form'){
    const m=S.modal, N=ensureNw(), pick=t=>catNames(t).filter(n=>m.sel[t].has(n)), R={income:pick('income'),expenses:pick('expenses')}, A=autoReturnCats();
    const same=t=>R[t].length===A[t].length&&R[t].every(n=>A[t].includes(n));
    if(same('income')&&same('expenses')) delete N.returnCats; else N.returnCats=R;
    saveNw(); closeModal(); render(); toast(L('nwRetSaved'));
  }
  else if(f.id==='nw-goal-form'){
    const v=parseAmount($('#ng-amt').value);
    if(v===null||v<=0){ $('#ng-err').textContent=L('nwGoalErr'); $('#ng-amt').focus(); return; }
    ensureNw().goal={amount:r2(v),month:ymOf(+$('#ng-y').value,+$('#ng-m').value)}; saveNw(); closeModal(); render(); toast(L('nwGoalSaved'));
  }
  else if(f.id==='limit-form'){
    const m=S.modal, raw=$('#lim-amt').value.trim(), v=parseAmount(raw), err=$('#lim-err');
    if(!raw){ const had=limitFor(m.name); setLimit(m.name,0); closeModal(); render(); if(had) toast(L('limitRemoved',m.name)); return; }
    if(v===null||v===0){ err.textContent=L('limitErr'); $('#lim-amt').focus(); return; }
    setLimit(m.name,Math.abs(v)); closeModal(); render(); toast(L('limitSaved',m.name,fmtEUR(Math.abs(v),0)));
  }
  else if(f.id==='addcat-form'){
    const t=S.modal.t, name=$('#ac-name').value.replace(/\s+/g,' ').trim(), err=$('#ac-err');
    if(!name){ err.textContent=L('enterName'); $('#ac-name').focus(); return; }
    if(isReservedCat(name)||catNames(t).some(n=>n.toLowerCase()===name.toLowerCase())){ err.textContent=L('catAlready',TL(t),name); $('#ac-name').focus(); return; }
    const picked=f.querySelector('input[name="ac-type"]:checked');
    const other=roleName(t,'other');
    const C=ensureCats(); const item=t==='expenses'?{name,type:picked?picked.value:'Want'}:{name};
    const oi=other?C[t].findIndex(c=>c.name===other):-1; if(oi>-1) C[t].splice(oi,0,item); else C[t].push(item);
    S.ui.ct.cq='';
    const back=S.modal.back;
    markDirty('config/categories'); bump(); closeModal(); render(); toast(L('addedCat',name)+(t==='expenses'?' ('+nwLabel(item.type)+')':''));
    if(back==='nwret'){ const R=returnCatsList(); openModal({type:'nwret',mid:true,sel:{income:new Set([...R.income,name]),expenses:new Set(R.expenses)}}); }
  }
  else if(f.id==='add-skip-form'){
    const w=$('#new-skip').value.trim(); if(!w) return;
    const list=skipList().slice();
    if(list.some(x=>x.toLowerCase()===w.toLowerCase())){ toast(L('skipExists',w)); return; }
    list.push(w); setSkip(list); const i=$('#new-skip'); if(i) i.focus();
    const n=skipHits(w).length;
    toast(n?L('skipAddedHits',w,n):L('skipAdded',w));
  }
  else if(f.id==='add-kw-form'){
    const t=S.ui.ct.table, k=$('#new-kw').value.trim(), cat=$('#new-kw-cat').value; if(!k||!cat) return;
    const K=ensureKw(); const ex=K[t].find(p=>p[0].toLowerCase()===k.toLowerCase());
    if(ex){ ex[1]=cat; } else K[t].push([k,cat]);
    S.ui.ct.newKw=''; S.ui.ct.newKwCat=cat; markDirty('config/keywords'); bump();
    let would=0; for(const r of allRows()) if(r.table===t&&!isKnown(t,r.category)){ const mt=matchKeyword(t,r.concept); if(mt&&mt.cat===cat&&mt.kw.toLowerCase()===k.toLowerCase()) would++; }
    render(); const i=$('#new-kw'); if(i) i.focus();
    toast(ex?L('kwNowPoints',k,cat):L('kwAdded',k,cat), would?{label:L('fillN',would),fn:()=>{ const r=categoriseBlanks(t); render(); toast(L('filled',r.filled,0)); }}:null);
  }
});

async function boot(){
  const h=(location.hash||'').replace('#',''); if(TABS.includes(h)) S.ui.tab=h;
  render();
  const C=window.claude;
  if(!C||typeof C.use!=='function'){ S.mode='nodb'; render(); return; }
  let db=null; try{ db=await C.use('db'); }catch(_){ db=null; }
  if(!db){ S.mode='nodb'; render(); return; }
  S.db=db; S.mode='live';
  try{ const u=await C.use('user'); if(u){ const c=await u.can('data.write'); S.canWrite=c!==false; } else S.canWrite=true; }catch(_){ S.canWrite=true; }
  if(window.Neutralino||window.YBT_WEB){ try{ S.local=await C.use('local'); }catch(_){ S.local=null; } }
  subscribe(); render();
  let auto=false; try{ auto=sessionStorage.getItem('ybt.autotour')==='1'; sessionStorage.removeItem('ybt.autotour'); }catch(_){}
  if(auto){ let n=0; const iv=setInterval(()=>{ if(isOnboarding()){ clearInterval(iv); ACTIONS['ob-start'](); } else if(++n>40) clearInterval(iv); },150); }
  C.use('downloads').then(d=>{ S.downloads=d||null; render(); }).catch(()=>{});
  C.use('sample').then(f=>{ S.ai=typeof f==='function'&&typeof f.json==='function'?f:null; if(S.ai) render(); }).catch(()=>{});
}
/* swaps in a whole dataset {months, config}. persist=true writes every document back (website restore and its undo);
   the desktop app's storage layer has already written its file, so it passes false */
function loadDataset(d,persist,soft){
  const c=(d&&d.config)||{}, prevLang=LANG, oldKeys=Object.keys(S.months);
  if(!persist){ dirty.clear(); clearTimeout(flushTimer); }
  S.months={}; for(const [k,v] of Object.entries((d&&d.months)||{})) S.months[k]=normMonth(v);
  S.cats=c.categories?normCats(c.categories):null; S.kw=c.keywords?normKw(c.keywords):null; S.settings=c.settings?clone(c.settings):null; S.nw=c.networth?normNw(c.networth):null; S.ui.nw.month=null;
  /* a file without a saved language keeps the one in use */
  S.ui.obLang=prevLang;
  if(S.settings&&!S.settings.lang){ S.settings.lang=prevLang; markDirty('config/settings'); }
  if(persist){
    for(const k of oldKeys) if(!S.months[k]) S.months[k]={income:[],expenses:[],investments:[]};   /* months the backup doesn't have are emptied */
    for(const k of Object.keys(S.months)) markDirty('months/'+k);
    markDirty('config/categories'); markDirty('config/keywords'); markDirty('config/settings'); markDirty('config/networth');
  }
  /* soft: data that arrived from another device or file: the screen, filters and any open dialog stay as they are */
  if(!soft){ S.ui.year=null; S.ui.mm={table:S.ui.mm.table,cat:null}; S.ui.oc.month='all'; S.ui.tx.cat='all'; S.ui.tx.month='all'; S.ui.editTarget=null; S.ui.obY=null; S.ui.yScroll=null; S.lastImport=null; closeModal(); }
  bump(); render();
}
function currentDataset(){
  const config={}; if(S.cats) config.categories=clone(S.cats); if(S.kw) config.keywords=clone(S.kw); if(S.settings) config.settings=clone(S.settings); config.networth=clone(nw());
  return {months:clone(S.months),config};
}
